  function drawBat(){
    const pinkRatio = heartCount < 3 ? heartCount*0.04 : Math.min(1, 0.12 + Math.pow((heartCount-3)/297, 0.72)*0.88);
    const bodyR = Math.round(28 + 115*pinkRatio);
    const bodyG = Math.round(38 + 55*pinkRatio);
    const bodyB = Math.round(48 + 90*pinkRatio);
    const wingR = Math.round(23 + 232*pinkRatio);
    const wingG = Math.round(31 + 85*pinkRatio);
    const wingB = Math.round(42 + 135*pinkRatio);
    const x=bat.x*W,y=bat.y;
    const celebrating=heartCelebration>0;
    const dancePhase=celebrating ? (1.45-heartCelebration) : 0;
    const flapPulse = bat.flapPhase > 0 ? bat.flapPhase / 0.18 : 0;
    const wingBeat = 0.5 + 0.5*Math.sin(t*13.5) + flapPulse*0.35;
    const verticalInfluence = Math.max(-1, Math.min(1, bat.vy/320));
    const wingLift = wingBeat*11 - verticalInfluence*7;
    const wingSweep = wingBeat*5 + verticalInfluence*3;
    ctx.save();
    ctx.translate(x,y + (celebrating?Math.sin(dancePhase*18)*7:0));
    if(celebrating){
      ctx.rotate(Math.sin(dancePhase*15)*.22);
      const pulse=1+Math.sin(dancePhase*22)*.07;
      ctx.scale(pulse,pulse);
    } else if(state==='crash') ctx.rotate(crashRotation);
    ctx.fillStyle=celebrating?'#ff4fa3':`rgb(${bodyR},${bodyG},${bodyB})`;ctx.beginPath();ctx.ellipse(0,5,18,24,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#0c1218';ctx.beginPath();ctx.arc(0,-10,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#f4f5f6';ctx.beginPath();ctx.moveTo(-12,-9);ctx.lineTo(-5,-26);ctx.lineTo(2,-19);ctx.lineTo(9,-26);ctx.lineTo(14,-8);ctx.lineTo(6,-2);ctx.lineTo(-1,-9);ctx.lineTo(-8,-2);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-11,4,0,Math.PI*2);ctx.arc(6,-10,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1e252d';ctx.beginPath();ctx.arc(-5,-10,2,0,Math.PI*2);ctx.arc(7,-9,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffb5d0';ctx.beginPath();ctx.arc(-5,-11,2,0,Math.PI*2);ctx.arc(6,-10,2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff8eb8';ctx.beginPath();ctx.moveTo(14,-3);ctx.lineTo(27,2);ctx.lineTo(14,6);ctx.closePath();ctx.fill();
    ctx.fillStyle=celebrating?'#ff79bd':`rgb(${Math.max(18,wingR)},${Math.max(24,wingG)},${Math.max(34,wingB)})`;ctx.beginPath();ctx.moveTo(-10,4);ctx.quadraticCurveTo(-34,-20-9*wingBeat,-48,-8+wingSweep);ctx.quadraticCurveTo(-34,10+wingLift,-10,13);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(10,4);ctx.quadraticCurveTo(34,-20-9*wingBeat,48,-8+wingSweep);ctx.quadraticCurveTo(34,10+wingLift,10,13);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#ff8eb9';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-12,7);ctx.lineTo(-39,-5-wingLift*.35);ctx.moveTo(12,7);ctx.lineTo(39,-5-wingLift*.35);ctx.stroke();if(pinkRatio>0.01){
      ctx.globalAlpha=0.08+0.18*pinkRatio;
      ctx.fillStyle='#ff6fa6';
      ctx.beginPath();ctx.arc(0,4,30+8*pinkRatio,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }
    if(shieldShatterFlash>0){
      ctx.save();
      const q=shieldShatterFlash/0.42;
      ctx.globalAlpha=q*.8;
      ctx.strokeStyle='#ffffff';ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(0,2,42+(1-q)*18,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=q*.35;
      ctx.fillStyle='#8fe8ff';
      ctx.beginPath();ctx.arc(0,2,48+(1-q)*20,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    if(heartShieldHits>0){
      const shieldPulse=1+Math.sin(t*7)*.035;
      ctx.save();
      ctx.scale(shieldPulse,shieldPulse);
      ctx.globalAlpha=.34;
      ctx.fillStyle='#9ee8ff';
      ctx.beginPath();ctx.arc(0,2,39,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=.92;
      ctx.strokeStyle='#d8f7ff';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(0,2,39,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=.55;
      ctx.strokeStyle='#73d6ff';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(0,2,34,0,Math.PI*2);ctx.stroke();
      ctx.restore();
      ctx.globalAlpha=1;
    }
    if(celebrating){
      ctx.globalAlpha=.75;
      for(let i=0;i<8;i++){
        const a=dancePhase*5+i*Math.PI/4;
        ctx.fillStyle=i%2?'#ffd0e5':'#fff1a8';
        ctx.beginPath();ctx.arc(Math.cos(a)*38,Math.sin(a)*31,3+(i%3),0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;
    }
    ctx.restore();
  }

  function drawSkyGuests(){
    for(const g of skyGuests){
      const y=g.y+Math.sin(g.bob)*5;
      ctx.save();ctx.translate(g.x,y);
      if(g.type==='balloon'){
        const palettes=[['#d84f43','#f1c86c'],['#5a82c8','#e6aa55'],['#9a5ea8','#f0d1a1'],['#4c9b72','#e5c64c']];
        const [a,b]=palettes[g.variant%palettes.length],r=g.r;
        // Envelope with alternating curved panels.
        ctx.fillStyle=a;ctx.beginPath();ctx.ellipse(0,-r*.25,r,r*1.12,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=b;ctx.beginPath();ctx.ellipse(0,-r*.25,r*.38,r*1.10,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(70,50,40,.55)';ctx.lineWidth=1.2;
        ctx.beginPath();ctx.ellipse(0,-r*.25,r,r*1.12,0,0,Math.PI*2);ctx.stroke();
        // Ropes and basket.
        ctx.strokeStyle='#6d5140';ctx.beginPath();ctx.moveTo(-r*.32,r*.66);ctx.lineTo(-r*.20,r*1.12);ctx.moveTo(r*.32,r*.66);ctx.lineTo(r*.20,r*1.12);ctx.stroke();
        ctx.fillStyle='#8b613f';ctx.fillRect(-r*.25,r*1.08,r*.50,r*.30);
      }else{
        const r=g.r;
        const colors=['#d74e48','#587fc0','#58a06e','#d89c42'];
        ctx.fillStyle=colors[g.variant%colors.length];
        ctx.beginPath();ctx.arc(0,-r*.35,r,Math.PI,0);ctx.closePath();ctx.fill();
        // canopy panel lines + suspension cords
        ctx.strokeStyle='#43505a';ctx.lineWidth=1.1;
        for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(k*r*.42,-r*.35);ctx.lineTo(0,r*.60);ctx.stroke();}
        // parachutist
        ctx.fillStyle='#263744';ctx.beginPath();ctx.arc(0,r*.66,r*.14,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#263744';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,r*.80);ctx.lineTo(0,r*1.25);ctx.moveTo(0,r*.92);ctx.lineTo(-r*.25,r*1.05);ctx.moveTo(0,r*.92);ctx.lineTo(r*.25,r*1.05);ctx.moveTo(0,r*1.25);ctx.lineTo(-r*.18,r*1.50);ctx.moveTo(0,r*1.25);ctx.lineTo(r*.18,r*1.50);ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawBoats(){
    for(const b of boats){
      ctx.save();ctx.translate(b.x,b.y);ctx.scale(b.scale,b.scale);
      if(b.type==='sail'){
        ctx.fillStyle='#f7f5ea';ctx.beginPath();ctx.moveTo(-25,3);ctx.lineTo(24,3);ctx.lineTo(16,11);ctx.lineTo(-18,11);ctx.closePath();ctx.fill();
        ctx.strokeStyle='#79563e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,3);ctx.lineTo(0,-38);ctx.stroke();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(2,-35);ctx.lineTo(2,0);ctx.lineTo(25,0);ctx.closePath();ctx.fill();
        ctx.fillStyle='#d75a48';ctx.beginPath();ctx.moveTo(-2,-30);ctx.lineTo(-2,0);ctx.lineTo(-19,0);ctx.closePath();ctx.fill();
      }else{
        ctx.fillStyle='#f2f0e8';ctx.fillRect(-35,-9,65,15);ctx.fillStyle='#354f5b';ctx.fillRect(-28,-17,45,9);
        ctx.fillStyle='#d55247';ctx.beginPath();ctx.moveTo(-39,6);ctx.lineTo(35,6);ctx.lineTo(26,14);ctx.lineTo(-30,14);ctx.closePath();ctx.fill();
        ctx.fillStyle='#8fd0df';for(let k=0;k<4;k++)ctx.fillRect(-23+k*11,-14,7,4);
      }
      // wake
      ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-42,15);ctx.quadraticCurveTo(-65,10,-84,17);ctx.stroke();
      ctx.restore();
    }
  }

  function draw() {
    ctx.save();
    if (state === 'crash' && screenShake > 0) ctx.translate((Math.random()-.5)*W*screenShake,(Math.random()-.5)*H*screenShake);
    drawBackground();
    // Drawn live, every frame, rather than as part of the cached city
    // bitmap — otherwise their worldScroll-based drift only ever gets
    // evaluated once (whenever that city's snapshot was built) and then
    // sits frozen in place for the rest of the visit. Skipped entirely for
    // destinations with no atmosphere (the Moon, Andromeda Galaxy).
    if (currentCity().country !== 'Space') drawClouds();
    drawLiveWeather();
    drawBoats();
    obstacles.forEach(drawObstacle);
    drawSkyGuests();
    for(const h of hearts){
      ctx.save();ctx.translate(h.x,h.y+Math.sin(h.phase)*4);ctx.fillStyle='#ff6fa6';
      ctx.beginPath();ctx.moveTo(0,10);ctx.bezierCurveTo(-16,0,-13,-13,-4,-13);ctx.bezierCurveTo(0,-13,2,-9,0,-6);ctx.bezierCurveTo(2,-9,4,-13,8,-13);ctx.bezierCurveTo(16,-13,18,0,0,10);ctx.fill();ctx.restore();
    }
    drawPlane();
    for (const p of wind) {ctx.globalAlpha=Math.max(0,p.life/.6);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(p.x-p.len*.45,p.y,p.x-p.len,p.y+2);ctx.stroke();}
    for (const p of particles) {ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#ff9fc8';ctx.fillRect(p.x,p.y,p.size,p.size);}
    ctx.globalAlpha=1;
    for(const p of heartBursts){
      ctx.save();
      ctx.globalAlpha=Math.max(0,p.life/.58);
      ctx.translate(p.x,p.y);
      const z=p.size;
      ctx.fillStyle='#ff6fa6';
      ctx.beginPath();
      ctx.moveTo(0,z);
      ctx.bezierCurveTo(-z*1.4,0,-z,-z,z*0,-z*.35);
      ctx.bezierCurveTo(z,-z,z*1.4,0,0,z);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha=1;
    // On the intro screen the live bat still animates behind the translucent
    // overlay, bleeding through as a second, unpositioned "Becky" alongside
    // the #introMark canvas bat that's actually placed above the title.
    // Hide the live one there so only the intentional one shows.
    if (state !== 'menu') drawBat();
    ctx.restore();
    if (impactFlash > 0) {
      ctx.fillStyle = (Math.floor(crashTime*18)%2===0) ? 'rgba(255,110,150,.35)' : 'rgba(255,255,255,.16)';
      ctx.fillRect(0,0,W,H);
      impactFlash = Math.max(0,impactFlash-0.016);
    }
  }

  let simAccumulator=0;
  const SIM_STEP=1/60;
  function loop(now) {
    let rawDt=(now-lastTime)/1000;
    if(!Number.isFinite(rawDt)||rawDt<0) rawDt=SIM_STEP;
    rawDt=Math.min(rawDt,.20);
    lastTime=now;
    simAccumulator=Math.min(.25,simAccumulator+rawDt);
    try {
      let steps=0;
      while(simAccumulator>=SIM_STEP && steps<12){
        if(state==='play') update(SIM_STEP);
        else if(state==='crash') updateCrash(SIM_STEP);
        else {
          // t and worldScroll drive every ambient parallax layer (clouds,
          // snow, distant skyline buildings) but normally only advance
          // during update(), i.e. only while actually playing. Outside
          // play they'd otherwise sit frozen at whatever value they last
          // had — since a fresh page load never played, that's t=0, so
          // every idle screen (and every city preview) showed the exact
          // same "stuck" cloud in the exact same spot. Keep them ticking
          // gently here too so the sky never looks like a pasted-on image.
          t += SIM_STEP; worldScroll += 70*SIM_STEP;
          updateSkyGuests(SIM_STEP, 70);
        }
        simAccumulator-=SIM_STEP;
        steps++;
      }
      if(steps===12) simAccumulator=0;
    } catch(err) {
      console.error('Becky update recovered',err);
      simAccumulator=0;
    }
    try {
      draw();
    } catch(err) {
      console.error('Becky draw recovered',err);
      renderRecoveryGrace=2.0;
      try{citySceneCache.delete(currentCity().name);}catch(_){}
      ctx.clearRect(0,0,W,H);
      gradient('#8fc8e5','#f3e5cc');
      drawBat();
    }
    raf=requestAnimationFrame(loop);
  }


  // --- Purchase-safe checkpointing -------------------------------------------------
  // Keep the exact run checkpoint in durable local storage so a successful payment
  // can never accidentally fall back to a fresh New York run.
  const CHECKPOINT_KEY = 'beckyContinueCheckpointV1';
  const CREDITED_TX_KEY = 'beckyCreditedHeartTransactionsV1';
  const PENDING_TX_KEY = 'beckyPendingHeartTransactionV1';

  function snapshotCheckpoint() {
    const checkpoint = {
      cityIndex: Number.isFinite(lastCrashCityIndex) ? Math.floor(lastCrashCityIndex) : Math.floor(runCityCount),
      distance: Number.isFinite(lastCrashDistance) ? lastCrashDistance : distance,
      runTime: Number.isFinite(lastCrashRunTime) ? lastCrashRunTime : t,
      cityTime: Number.isFinite(lastCrashCityTime) ? lastCrashCityTime : cityTime,
      runCityCount: Number.isFinite(lastCrashRunCityCount) ? Math.floor(lastCrashRunCityCount) : Math.floor(runCityCount),
      heartCount: Number.isFinite(heartCount) ? Math.floor(heartCount) : 0,
      nextHeartCelebration: Number.isFinite(nextHeartCelebration) ? Math.floor(nextHeartCelebration) : 20,
      savedAt: Date.now()
    };
    try { localStorage.setItem(CHECKPOINT_KEY, JSON.stringify(checkpoint)); } catch (_) {}
    return checkpoint;
  }

  function readCheckpoint() {
    try {
      const raw = localStorage.getItem(CHECKPOINT_KEY);
      if (!raw) return null;
      const p = JSON.parse(raw);
      if (!p || !Number.isFinite(p.runTime) || !Number.isFinite(p.distance)) return null;
      return p;
    } catch (_) { return null; }
  }

  function rememberCreditedTransaction(txid) {
    if (!txid) return;
    try {
      const arr = JSON.parse(localStorage.getItem(CREDITED_TX_KEY) || '[]');
      const list = Array.isArray(arr) ? arr : [];
      if (!list.includes(String(txid))) list.push(String(txid));
      while (list.length > 50) list.shift();
      localStorage.setItem(CREDITED_TX_KEY, JSON.stringify(list));
    } catch (_) {}
  }

  function wasTransactionCredited(txid) {
    if (!txid) return false;
    try {
      const arr = JSON.parse(localStorage.getItem(CREDITED_TX_KEY) || '[]');
      return Array.isArray(arr) && arr.includes(String(txid));
    } catch (_) { return false; }
  }

  function transactionIdOf(tx) {
    if (!tx) return '';
    return String(tx.transactionId || tx.transactionID || tx.purchaseToken || tx.orderId || tx.id || '').trim();
  }

  function productIdOf(tx) {
    return String(tx?.productIdentifier || tx?.productId || '').trim();
  }

  function persistPendingTransaction(tx) {
    const id = transactionIdOf(tx);
    if (!id) return;
    try {
      localStorage.setItem(PENDING_TX_KEY, JSON.stringify({
        transactionId: id,
        productIdentifier: productIdOf(tx),
        savedAt: Date.now()
      }));
    } catch (_) {}
  }

  function clearPendingTransaction() {
    try { localStorage.removeItem(PENDING_TX_KEY); } catch (_) {}
  }

  // If the app was killed or backgrounded between a purchase resolving and
  // finishPaidContinue() crediting it, StoreKit will already have finished a
  // consumable transaction — so restorePurchases()/getPurchases() at next
  // launch won't surface it again, and the hearts would otherwise be lost
  // even though the player paid for them. persistPendingTransaction() saves
  // just enough (transaction id + product id) to credit it here on the next
  // launch; creditPurchaseOnce() dedups, so this is a safe no-op if the
  // purchase was actually credited before the app closed.
  function recoverPendingTransaction() {
    // Pending TX lives in client-writable localStorage. Only honor it inside
    // the native app where it was set after a NativePurchases result — never
    // credit from a forged pending blob on the web build.
    const isNative = !!(window.Capacitor?.isNativePlatform?.());
    if (!isNative) {
      clearPendingTransaction();
      return;
    }
    try {
      const raw = localStorage.getItem(PENDING_TX_KEY);
      if (raw) {
        const pending = JSON.parse(raw);
        if (pending && pending.transactionId) {
          // The checkpoint was saved before the purchase was opened, so it
          // still reflects the run the player paid to continue — even
          // though the app relaunched fresh (state reset to 'menu') between
          // the purchase completing and finishPaidContinue() ever running.
          const checkpoint = readCheckpoint();
          const credited = creditPurchaseOnce({transactionId: pending.transactionId, productIdentifier: pending.productIdentifier});
          if (credited && checkpoint) resumeFromCrash('hearts', checkpoint, true);
        }
      }
    } catch (_) {}
    clearPendingTransaction();
  }

  function isCompletedTransaction(tx) {
    if (!tx) return false;
    if (tx.success === false || tx.completed === false) return false;
    if (tx.isPending === true || tx.pending === true) return false;
    const stateValue = String(tx.purchaseState || tx.state || '').toUpperCase();
    if (stateValue && ['PENDING','FAILED','CANCELLED','CANCELED','DEFERRED'].includes(stateValue)) return false;
    return true;
  }

  function creditPurchaseOnce(tx) {
    const txid = transactionIdOf(tx);
    // Only credit from a completed transaction object (native IAP). Web must
    // never invent credits from URL params or client-writable storage alone.
    if (!txid || !isCompletedTransaction(tx)) return false;
    if (productIdOf(tx) !== 'com.beckybat.game.hearts100') return false;
    if (wasTransactionCredited(txid)) return true;

    bankedHearts += 100;
    rememberCreditedTransaction(txid);
    clearPendingTransaction();
    saveHeartBank();
    return true;
  }

  async function resumeFromCrash(source, checkpointOverride=null, forceResume=false) {
    // forceResume skips the "must currently be on the game-over screen" gate.
    // Needed for the Stripe web checkout: paying there is a full page
    // navigation away and back, so by the time the redirect lands, state has
    // already reset to 'menu' — there is no live 'over' screen to gate on,
    // even though the player really did just pay to continue their run.
    if ((!forceResume && state !== 'over') || source !== 'hearts' || bankedHearts < 100) return false;
    const checkpoint = checkpointOverride || readCheckpoint() || snapshotCheckpoint();
    if (!checkpoint) return false;

    // Apply the checkpoint FIRST. This prevents any city/random-state reset from
    // occurring between purchase completion and the actual continue action.
    const resumeTime = Math.max(0, Number(checkpoint.runTime) || 0);
    const resumeDistance = Math.max(0, Number(checkpoint.distance) || 0);
    const resumeCityCount = Math.max(0, Math.floor(Number.isFinite(checkpoint.runCityCount) ? checkpoint.runCityCount : resumeTime / 9));

    bankedHearts -= 100;
    saveHeartBank();

    lastCrashCityIndex = Math.max(0, Math.floor(Number(checkpoint.cityIndex) || resumeCityCount));
    lastCrashDistance = resumeDistance;
    lastCrashRunTime = resumeTime;
    lastCrashCityTime = Math.max(0, Math.min(8.75, Number(checkpoint.cityTime) || (resumeTime - resumeCityCount * 9)));
    lastCrashRunCityCount = resumeCityCount;

    distance = resumeDistance;
    t = resumeTime;
    runCityCount = resumeCityCount;
    cityIndex = resumeCityCount;
    cityTime = resumeTime - resumeCityCount * 9;
    // Older checkpoints saved before this field existed simply omit it —
    // falling back to the current in-memory value (rather than 0) means an
    // in-session continue (no page reload in between) still just works.
    if (Number.isFinite(checkpoint.heartCount)) heartCount = Math.floor(checkpoint.heartCount);
    if (Number.isFinite(checkpoint.nextHeartCelebration)) nextHeartCelebration = Math.floor(checkpoint.nextHeartCelebration);

    state = 'play';
    holding = false;
    continueGrace = 3.2;
    cityTransitionGrace = 0;
    obstacles = [];
    skyGuests = [];
    hearts = [];
    particles = [];
    heartBursts = [];
    wind = [];
    spawnTime = 3.0;
    weatherTime = 8;
    screenShake = 0;
    impactFlash = 0;
    crashTime = 0;
    crashVelocity = 0;
    crashRotation = 0;
    bat.y = H*.5;
    bat.vy = 0;
    bat.flapPhase = 0;
    gameover.classList.add('hidden');
    intro.classList.add('hidden');
    continueBoxEl.classList.add('hidden');
    purchaseBusyEl.textContent = '';
    updateHeartHud('bank');
    cityEl.textContent = currentCity().name;
    updateCityTierHud();
    return true;
  }

  async function finishPaidContinue(tx) {
    const checkpoint = readCheckpoint();
    if (!checkpoint) snapshotCheckpoint();
    const credited = creditPurchaseOnce(tx);
    if (!credited) return false;
    if (state === 'over') return await resumeFromCrash('hearts', checkpoint || readCheckpoint());
    continueHeartsEl.disabled = bankedHearts < 100;
    return true;
  }

  // Web Stripe Payment Link + query-param credit was removed (2026-09-17):
  // without a backend we cannot verify Checkout Session payment_status, so
  // ?stripe_success=1&session_id=* was forgeable free hearts. Native IAP via
  // Capacitor NativePurchases remains the paid path. Web players collect
  // hearts in-run or open the App Store build.
  const APP_STORE_URL = 'https://apps.apple.com/app/id6803877783';
  // Kept only so old bookmarks / Stripe return URLs do not 404 the game —
  // we deliberately do NOT credit hearts from query params.
  const STRIPE_PAYMENT_LINK = 'https://buy.stripe.com/28E3cv9wH8uPfPK9TI5EY00';

  function handleStripeReturn() {
    const params = new URLSearchParams(location.search);
    if (params.get('stripe_success') !== '1' && !params.get('session_id')) return;
    // Strip any leftover Stripe return query so it cannot be mistaken for a credit.
    history.replaceState({}, '', location.pathname);
    if (purchaseBusyEl) {
      purchaseBusyEl.textContent = 'WEB PURCHASES DISABLED — USE THE APP STORE';
      setTimeout(() => { if (purchaseBusyEl) purchaseBusyEl.textContent = ''; }, 3200);
    }
  }

  async function buy100Hearts() {
    // isNative distinguishes "genuinely a web browser" from "packaged app,
    // but the purchases plugin happened not to be available" — the two were
    // conflated before by just checking for NP, so if the native plugin ever
    // failed to register for any reason, the app would fall into the *web*
    // branch below and try to navigate to the external Stripe checkout URL.
    // The app's own WKWebView blocks/bounces that kind of external
    // navigation, which reloads the page from scratch — this is what
    // "buying restarts the game" was: not a real restart, a botched
    // navigation attempt masquerading as one. The native app must never
    // take the web-redirect path, full stop, regardless of why NP is
    // unavailable.
    const isNative = !!(window.Capacitor?.isNativePlatform?.());
    const NP = window.Capacitor?.Plugins?.NativePurchases;
    if (!isNative) {
      if (state !== 'over') return;
      if (bankedHearts >= 100) { await resumeFromCrash('hearts'); return; }
      // No server-side Stripe verify on this static site — do not redirect
      // to Payment Link or credit on return. Point players at the App Store.
      purchaseBusyEl.textContent = 'BUY HEARTS IN THE APP STORE';
      continuePurchaseEl.textContent = 'GET BECKY ON THE APP STORE';
      purchaseMetaEl.innerHTML = 'In-browser heart purchases are disabled (no payment verify).<br><a href="' + APP_STORE_URL + '" target="_blank" rel="noopener" style="color:#fff">Open App Store</a> · or collect 100 hearts in-run';
      setTimeout(() => { if (purchaseBusyEl) purchaseBusyEl.textContent = ''; }, 2800);
      try { (window.top || window).open(APP_STORE_URL, '_blank', 'noopener'); } catch (_) {}
      return;
    }
    if (!NP || typeof NP.purchaseProduct !== 'function') {
      if (state !== 'over') return;
      console.warn('Becky: NativePurchases plugin unavailable inside native app');
      purchaseBusyEl.textContent = 'PURCHASES UNAVAILABLE — TRY AGAIN SHORTLY';
      setTimeout(() => { if (purchaseBusyEl) purchaseBusyEl.textContent = ''; }, 2500);
      return;
    }
    if (state !== 'over') return;
    // Never charge for hearts the player can already use for free.
    if (bankedHearts >= 100) { await resumeFromCrash('hearts'); return; }

    // Take a durable snapshot immediately before opening payment.
    const checkpoint = snapshotCheckpoint();
    continuePurchaseEl.disabled = true;
    continueHeartsEl.disabled = true;
    purchaseBusyEl.textContent = 'OPENING APPLE PAYMENT…';
    try {
      const res = await NP.purchaseProduct({
        productIdentifier:'com.beckybat.game.hearts100',
        quantity:1,
        isConsumable:true,
        autoAcknowledgePurchases:true
      });
      persistPendingTransaction(res);
      const ok = await finishPaidContinue(res);
      if (!ok) {
        purchaseBusyEl.textContent = 'PAYMENT RECEIVED — VERIFYING…';
      } else {
        purchaseBusyEl.textContent = 'PURCHASE COMPLETE — KEEP FLYING!';
      }
    } catch (err) {
      console.warn('Becky purchase cancelled/failed', err);
      purchaseBusyEl.textContent = 'PURCHASE CANCELLED';
      continueHeartsEl.disabled = bankedHearts < 100;
    } finally {
      continuePurchaseEl.disabled = false;
      setTimeout(() => { if (purchaseBusyEl) purchaseBusyEl.textContent = ''; }, 2200);
    }
  }

  async function recoverNativeTransactions() {
    const NP = window.Capacitor?.Plugins?.NativePurchases;
    if (!NP) return;

    // iOS StoreKit can deliver a transaction that finished while the app was
    // suspended/terminated. The listener below handles live updates; this check
    // also handles a transaction returned by the plugin during launch/recovery.
    try {
      if (typeof NP.restorePurchases === 'function') await NP.restorePurchases();
    } catch (_) {}

    // Consumables may not remain restorable after consumption, but querying current
    // purchases is harmless and helps recover interrupted flows where the plugin has
    // not yet finalized the transaction locally.
    try {
      if (typeof NP.getPurchases === 'function') {
        const res = await NP.getPurchases({});
        const purchases = Array.isArray(res?.purchases) ? res.purchases : [];
        for (const tx of purchases) {
          if (productIdOf(tx) === 'com.beckybat.game.hearts100' && isCompletedTransaction(tx)) {
            await finishPaidContinue(tx);
            break;
          }
        }
      }
    } catch (_) {}
  }

  async function wirePurchaseListener() {
    const NP = window.Capacitor?.Plugins?.NativePurchases;
    if (!NP || typeof NP.addListener !== 'function') return;
    try {
      await NP.addListener('transactionUpdated', async (event) => {
        const tx = event?.transaction || event;
        if (productIdOf(tx) !== 'com.beckybat.game.hearts100') return;
        persistPendingTransaction(tx);
        if (isCompletedTransaction(tx)) {
          await finishPaidContinue(tx);
        }
      });
    } catch (_) {}
  }

  async function loadContinuePrice() {
    const NP = window.Capacitor?.Plugins?.NativePurchases;
    if (!NP || typeof NP.getProducts !== 'function') {
      // Web build: paid hearts only via App Store IAP (no forgeable Stripe return).
      continuePurchaseEl.textContent = 'GET BECKY ON THE APP STORE';
      purchaseMetaEl.innerHTML = 'Web heart purchases disabled · collect 100 in-run or buy in the app<br><a href="' + APP_STORE_URL + '" target="_blank" rel="noopener" style="color:#fff">App Store</a> · <a href="mailto:support@astryks.com" style="color:#fff">support@astryks.com</a>';
      return;
    }
    continuePurchaseEl.disabled = true;
    try {
      const res = await NP.getProducts({productIdentifiers:['com.beckybat.game.hearts100']});
      const prod = res?.products?.[0];
      const price = prod?.priceString || prod?.localizedPrice;
      continuePurchaseEl.textContent = price ? ('BUY 100 HEARTS · ' + price) : 'BUY 100 HEARTS';
    } catch (_) {
      continuePurchaseEl.textContent = 'BUY 100 HEARTS';
    } finally {
      continuePurchaseEl.disabled = false;
    }
  }

  function pointerDown(e) {
    e.preventDefault();
    // Exclude the whole continue panel and any open overlay, not just their buttons —
    // a mis-tap a few pixels off "BUY"/"USE" should never silently restart the run.
    if (e.target && e.target.closest && e.target.closest('button, a, .continueBox, #getAppMenu, #shareMenu')) return;
    if (state === 'menu' || state === 'over') resetGame();
    if (state === 'play') holding = true;
  }
  function pointerUp() { holding = false; }
  addEventListener('pointerdown',pointerDown,{passive:false});
  addEventListener('pointerup',pointerUp);
  addEventListener('pointercancel',pointerUp);
  addEventListener('blur',pointerUp);
  addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state==='menu'||state==='over')resetGame();holding=true;}});
  addEventListener('keyup',e=>{if(e.code==='Space')holding=false;});
  document.getElementById('again').onclick = resetGame;
  continueHeartsEl.onclick = async () => { await resumeFromCrash('hearts'); };
  continuePurchaseEl.onclick = buy100Hearts;
  loadContinuePrice();
  wirePurchaseListener();
  recoverPendingTransaction();
  recoverNativeTransactions();
  handleStripeReturn();
  function closeShareMenu() {
    const el = document.getElementById('shareMenu');
    if (el) el.remove();
  }

  function openShareMenu(msg, shareUrl) {
    closeShareMenu();
    const wrap = document.createElement('div');
    wrap.id = 'shareMenu';
    wrap.style.cssText = 'position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#0009';
    // msg already includes the URL at the end, so Facebook/WhatsApp/X show the
    // full line ("I flew...Can you beat me? https://...") instead of dropping
    // the text and only surfacing a bare link/preview card.
    const fb = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(shareUrl) + '&quote=' + encodeURIComponent(msg);
    const tw = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(msg);
    const wa = 'https://wa.me/?text=' + encodeURIComponent(msg);
    wrap.innerHTML = `
      <div style="background:#152036;border-radius:22px;padding:22px;width:min(320px,84vw);text-align:center;box-shadow:0 20px 50px #000a">
        <div style="font-weight:1000;font-size:16px;letter-spacing:.5px;margin-bottom:14px">SHARE YOUR SCORE</div>
        <a href="${fb}" target="_blank" rel="noopener" style="display:block;background:#3b5998;color:#fff;border-radius:999px;padding:12px;margin:8px 0;font-weight:900">Facebook</a>
        <a href="${tw}" target="_blank" rel="noopener" style="display:block;background:#000;color:#fff;border-radius:999px;padding:12px;margin:8px 0;font-weight:900">X (Twitter)</a>
        <a href="${wa}" target="_blank" rel="noopener" style="display:block;background:#25D366;color:#fff;border-radius:999px;padding:12px;margin:8px 0;font-weight:900">WhatsApp</a>
        <button id="shareCopyBtn" style="display:block;width:100%;background:#ff6fa8;color:#fff;border-radius:999px;padding:12px;margin:8px 0;font-weight:900;border:0">Copy Link</button>
        <button id="shareCloseBtn" style="display:block;width:100%;background:transparent;color:#fff9;border-radius:999px;padding:10px;margin-top:4px;font-weight:800;border:0;font-size:13px">Close</button>
        <div style="font-size:10px;color:#fff6;margin-top:10px;line-height:1.4">Instagram and TikTok don't accept shared posts from websites — screenshot your score to share there instead.</div>
      </div>`;
    document.body.appendChild(wrap);
    wrap.addEventListener('click', (e) => { if (e.target === wrap) closeShareMenu(); });
    document.getElementById('shareCloseBtn').onclick = closeShareMenu;
    document.getElementById('shareCopyBtn').onclick = async () => {
      const copyBtn = document.getElementById('shareCopyBtn');
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(msg);
        } else {
          const ta = document.createElement('textarea');
          ta.value = msg;
          ta.style.cssText = 'position:fixed;left:-9999px;top:0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        copyBtn.textContent = 'Copied!';
        setTimeout(closeShareMenu, 900);
      } catch (_) {
        copyBtn.textContent = 'Could not copy — try again';
      }
    };
  }

  document.getElementById('share').onclick = async () => {
    const shareBtn = document.getElementById('share');
    if (shareBtn.disabled) return;
    const score = finalEl.textContent;
    const shareUrl = 'https://beckythebat.com/';
    const baseMsg = `I flew ${score}m and burst ${heartCount} hearts in Becky the Bat! 🦇🌍 Last city: ${currentCity().name}. Can you beat me?`;
    const msg = `${baseMsg} ${shareUrl}`;
    shareBtn.disabled = true;
    let shared = false;
    let cancelled = false;
    if (navigator.share) {
      try {
        // Some mobile browsers/WebViews report navigator.share as available but
        // never resolve or reject the promise, leaving the button looking dead
        // until tapped repeatedly. Race it against a timeout so a genuine hang
        // still falls through to the share menu instead of stalling forever —
        // but keep it generous: a *working* native share sheet only resolves
        // once the person actually picks an app or cancels, which routinely
        // takes several seconds. A short timeout here was firing while the
        // real share sheet was still open, popping our fallback menu on top
        // of it — this is what "share doesn't work" on real devices was.
        //
        // Pass url as its own field rather than folding it into text: apps on
        // the receiving end (Messages, WhatsApp, Twitter/X) combine the two
        // themselves, and it lets beckythebat.com's Open Graph tags supply the
        // Becky icon as the link preview image. Facebook's share extension
        // specifically still won't show our caption text either way — that's
        // an anti-spam restriction on their end, not something an app calling
        // the Web Share API can override — but the link preview (title,
        // description, Becky icon) now comes through correctly there too.
        shared = await Promise.race([
          navigator.share({title:'Becky the Bat', text:baseMsg, url:shareUrl}).then(() => true),
          new Promise(resolve => setTimeout(() => resolve(false), 8000))
        ]);
      } catch (err) {
        if (err && err.name === 'AbortError') cancelled = true;
      }
    }
    shareBtn.disabled = false;
    if (!shared && !cancelled) openShareMenu(msg, shareUrl);
  };

  pillEl.textContent = 'BEST ' + best + ' m';
  scoreEl.innerHTML = '0<small> m</small>'; updateHeartHud('bank'); updateCityTierHud();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
