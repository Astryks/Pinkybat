  function buildEndlessOrder(cycle){
    // Deterministic shuffle per completed 183-scene cycle; first cycle stays curated.
    const a=cities.map((_,i)=>i);
    let seed=(0x9e3779b9 ^ (cycle*0x85ebca6b))>>>0;
    function rnd(){ seed^=seed<<13; seed^=seed>>>17; seed^=seed<<5; return (seed>>>0)/4294967296; }
    for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}
    return a;
  }

    const cycle=Math.floor(idx/n);
    if(cycle===0) return cities[idx % n] || cities[0];
    if(cycle!==endlessCycle){ endlessOrder=buildEndlessOrder(cycle); endlessCycle=cycle; }
    const mapped=endlessOrder[idx % n];
    return cities[Number.isInteger(mapped)?mapped:0] || cities[0];
  }

  function spawnObstacle() {
    const n=runCityCount+1;
    let depth=.32,widthFactor=.158;
    if(n>=14)  {depth=.35;widthFactor=.166;}
    if(n>=51)  {depth=.365;widthFactor=.172;}
    if(n>=101) {depth=.405;widthFactor=.186;}
    if(n>=151) {depth=.455;widthFactor=.202;}
    if(n>=176) {depth=.475;widthFactor=.212;}

    const w=Math.max(66,Math.min(140,W*widthFactor));
    const pool=['eiffel','statue','bigben','burj','sleigh','giraffe','volcano','skyscraper','bridge'];
    const type=pool[Math.floor(Math.random()*pool.length)];

    // Random obstacle lane with fairness memory. Placement remains unpredictable,
    // but top, bottom and middle are each guaranteed to recur regularly.
    const lanes=['top','bottom','middle'];
    let side=lanes[Math.floor(Math.random()*lanes.length)];
    obstacleLaneHistory.push(side);
    if(obstacleLaneHistory.length>5) obstacleLaneHistory.shift();
    for(const lane of lanes){
      if(!obstacleLaneHistory.includes(lane)){
        side=lane;
        obstacleLaneHistory[obstacleLaneHistory.length-1]=lane;
        break;
      }
    }

    if(side==='middle'){
      const mh=Math.max(78,Math.min(H*(n>=151?.27:n>=101?.24:n>=51?.22:.20), n>=151?172:n>=101?154:138));
      const centerJitter=(Math.random()-.5)*H*.12;
      const y=Math.max(H*.28,Math.min(H*.72-mh,H*.50-mh*.5+centerJitter));
      obstacles.push({x:W+70,y,w,h:mh,type,side:'middle',edgeY:y+mh*.5});
      return;
    }

    const h=Math.min(H*(n>=151?.47:.43),H*depth);
    const y=side==='top'?0:H-h;
    const edgeY=side==='top'?h:H-h;
    obstacles.push({x:W+70,y,w,h,type,side,edgeY});
  }

  function hit(o) {
    const px=bat.x*W,py=bat.y;
    const bodyR=Math.max(4,bat.r*.24);
    const left=o.x+o.w*.23,right=o.x+o.w*.77;
    if(px+bodyR<left || px-bodyR>right) return false;

    if(o.side==='middle'){
      const top=o.y+14,bottom=o.y+o.h-14;
      return py+bodyR>top && py-bodyR<bottom;
    }

    const inset=14;
    if(o.side==='top') return py-bodyR < o.edgeY-inset;
    return py+bodyR > o.edgeY+inset;
  }

  // Spawns and drifts the hot-air balloons/parachutes seen in the sky.

  // from the render loop while idling on the menu/game-over screens, so the
  // sky always has something genuinely moving through it rather than a
  // single balloon painted in a fixed spot.
  function updateSkyGuests(dt, sp) {
    skyGuestTimer -= dt;
    if (skyGuestTimer <= 0 && skyGuests.length < 2) {
      const type = Math.random() < 0.58 ? 'balloon' : 'parachute';
      const r = type === 'balloon' ? Math.max(24,Math.min(34,W*.055)) : Math.max(19,Math.min(27,W*.043));
      // Spawn well away from Becky's current position and never in the low
      // start lane. Parachutes are especially constrained because their body
      // hangs below the canopy.
      const minY = type === 'parachute' ? H*.18 : H*.16;
      const maxY = type === 'parachute' ? H*.47 : H*.56;
      let y = minY + Math.random()*(maxY-minY);
      const batY = bat.y;
      if (Math.abs(y-batY) < H*.20) {
        y = batY < H*.40 ? Math.min(maxY,batY+H*.24) : Math.max(minY,batY-H*.24);
      }
      skyGuests.push({type,x:W+r+35,y,r,bob:Math.random()*6.28,variant:Math.floor(Math.random()*4),age:0});
      skyGuestTimer = 5.5 + Math.random()*6.5;
    }
    for(let i=skyGuests.length-1;i>=0;i--){
      const g=skyGuests[i];
      g.x -= sp*dt*.72;
      g.bob += dt*1.8;
      g.age = (g.age||0) + dt;
      if(g.x+g.r*2<-80) skyGuests.splice(i,1);
    }
  }

  function update(dt) {
    t += dt;
    // Milestone difficulty curve:
    // Curated 183-destination difficulty curve:
    // 1-50 approachable; 51+ clearly harder; 101+ substantially faster;
    // 151+ extremely difficult. Later endless cycles stay at the extreme tier.
    const n = runCityCount + 1;
    // Starting difficulty: 7.5/10, eased to 7.3/10 for the first 30 seconds
    // so new players get a fair runway before it ramps up. Distance
    // milestones add major speed jumps after that.
    // 2,000m = faster; 5,000m = much faster; 10,000m = very fast; 20,000m = extreme.
    let baseSpeed=300, speedCap=500, gravity=900;
    if(t<30)  { baseSpeed=292; speedCap=488; gravity=875; }
    if(n>=20)  { baseSpeed=312; speedCap=520; gravity=910; }
    if(n>=51)  { baseSpeed=330; speedCap=550; gravity=925; }
    if(n>=101) { baseSpeed=350; speedCap=590; gravity=945; }
    if(n>=151) { baseSpeed=390; speedCap=650; gravity=970; }

    let milestoneBoost=0;
    if(distance>=2000)  milestoneBoost += 70;
    if(distance>=5000)  milestoneBoost += 95;
    if(distance>=10000) milestoneBoost += 125;
    if(distance>=20000) milestoneBoost += 190;

    const timeBoost=Math.min(90,t*.72);
    const distanceBoost=Math.min(85,distance*.016);
    const milestoneCap = distance>=20000 ? 1100 : distance>=10000 ? 900 : distance>=5000 ? 760 : distance>=2000 ? 640 : speedCap;
    const sp=Math.min(milestoneCap,baseSpeed+timeBoost+distanceBoost+milestoneBoost);
    worldScroll += sp * dt;
    distance += sp * dt * 0.055;

    if (holding) flap();
    bat.vy += gravity * dt;
    bat.vy *= 0.994;
    bat.y += bat.vy * dt;
    bat.flapPhase = Math.max(0, bat.flapPhase - dt);
    // Screen edges are not obstacles. Clamp Becky inside the viewport so
    // mobile resize/touch jitter cannot look like a random crash.
    if (bat.y < bat.r) {
      bat.y = bat.r;
      bat.vy = Math.max(45, Math.abs(bat.vy)*.18);
    }
    if (bat.y > H - bat.r) {
      bat.y = H - bat.r;
      bat.vy = -Math.max(45, Math.abs(bat.vy)*.18);
    }

    // Destination progression is derived directly from total run time.
    // A landmark renderer can no longer stall, skip or extend any destination.
    const absoluteCity=Math.max(0,Math.floor(t/9));
    cityTime=t-absoluteCity*9;
    if(absoluteCity!==runCityCount){
      const oldCount=runCityCount;
      runCityCount=absoluteCity;
      cityIndex=absoluteCity;
      weatherTime=0;
      cityTransitionGrace=0.65;
      if(Math.floor(runCityCount/cities.length)!==Math.floor(oldCount/cities.length)){
        replayVisit=Math.max(0,Math.floor(Number(replayVisit)||0))+1;
        replayNight=(replayVisit%4!==0);
      }
    }
    cityEl.textContent=currentCity().name;
    updateCityTierHud();
    if (continueGrace > 0) continueGrace = Math.max(0, continueGrace - dt);
    if (cityTransitionGrace > 0) cityTransitionGrace = Math.max(0, cityTransitionGrace - dt);
    if (renderRecoveryGrace > 0) renderRecoveryGrace = Math.max(0, renderRecoveryGrace - dt);
    chooseWeather(dt);

    spawnTime -= dt;
    if (spawnTime <= 0) {
      const last = obstacles.length ? obstacles[obstacles.length-1] : null;
      const n=runCityCount+1;
      // Never create another hazard while the previous one is still near the
      // player's half of the screen.
      const enoughSpace=!last || last.x < W*.43;
      if (enoughSpace) {
        spawnObstacle();
        // Milestone cadence mirrors speed/gap difficulty while retaining spacing.
        const n=runCityCount+1;
        let base=1.48,jitter=.32;
        if(t<30)   {base=1.58;jitter=.34;}
        if(n>=14)  {base=1.38;jitter=.30;}
        if(n>=30)  {base=1.30;jitter=.28;}
        if(n>=51)  {base=1.18;jitter=.25;}
        if(n>=101) {base=1.18;jitter=.28;}
        if(n>=151) {base=.88;jitter=.18;}
        if(n>=176) {base=.90;jitter=.22;}
        spawnTime=base+Math.random()*jitter;
      } else {
        spawnTime = 0.22;
      }
    }
    heartPathPhase += dt*1.8;
    if (Math.random() < dt*0.42 && hearts.length < 5) {
      const lane = hearts.length % 3;
      const zigY = H*(0.38 + lane*0.10) + Math.sin(heartPathPhase*1.15 + lane)*H*0.035;
      hearts.push({x:W+70+lane*24,y:zigY,phase:Math.random()*6.28,r:13,lane});
    }
    for (let i=hearts.length-1;i>=0;i--) {
      const h=hearts[i];
      h.x-=sp*dt;
      h.phase+=dt*5;
      h.y += Math.sin(heartPathPhase*1.7 + h.lane*1.4)*0.35;
      const dx=bat.x*W-h.x,dy=bat.y-h.y,rr=bat.r*.70+h.r*1.15;
      if(dx*dx+dy*dy<rr*rr){
        hearts.splice(i,1);
        heartCount++;
        bankedHearts++;
        saveHeartBank();
        if(heartCount>=nextHeartCelebration){
          nextHeartCelebration += 20;
          heartCelebration=1.45;
          // Cute milestone reward: one shield that absorbs exactly one obstacle hit.
          heartShieldHits=1;
          heartCelebrationTarget=null;
        }
        for(let j=0;j<16;j++){
          const a=(Math.PI*2*j)/16 + Math.random()*.18;
          const v=70+Math.random()*90;
          heartBursts.push({x:h.x,y:h.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.58,size:3+Math.random()*3});
        }
      } else if(h.x < -50) hearts.splice(i,1);
    }

    // Occasional airborne obstacles. These move more slowly than landmarks
    // and use compact circular hit areas matching their visible shapes.
    updateSkyGuests(dt, sp);

    // Boats are visual ambience at the bottom only and never collide with Becky.
    boatTimer -= dt;
    if(cityHasWater()){
      if(boatTimer<=0 && boats.length<2){
        boats.push({x:W+90,y:H*(.89+Math.random()*.045),scale:.75+Math.random()*.45,type:Math.random()<.55?'sail':'ferry'});
        boatTimer=6+Math.random()*8;
      }
      for(let i=boats.length-1;i>=0;i--){
        boats[i].x-=sp*dt*.42;
        if(boats[i].x<-140)boats.splice(i,1);
      }
    }else{
      boats.length=0;
      boatTimer=Math.max(boatTimer,2);
    }

    if(heartCelebration>0){
      heartCelebration=Math.max(0,heartCelebration-dt);
    }
    if(shieldShatterFlash>0) shieldShatterFlash=Math.max(0,shieldShatterFlash-dt);

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      if(!o || !Number.isFinite(o.x)||!Number.isFinite(o.y)||!Number.isFinite(o.w)||!Number.isFinite(o.h)||!Number.isFinite(o.edgeY)){
        obstacles.splice(i,1);continue;
      }
      o.x -= sp * dt;
      if (o.x + o.w < -120) obstacles.splice(i,1);
      else if (t > 3.0 && continueGrace <= 0 && cityTransitionGrace <= 0 && renderRecoveryGrace <= 0 && hit(o)) {
        if(heartShieldHits>0){
          // One extra life: any obstacle, wherever it is, is shattered on impact.
          // Becky is never killed by this hit. The shield is consumed immediately.
          heartShieldHits=0;
          shieldShatterFlash=0.42;
          const ox=o.x+o.w*.5, oy=o.side==='middle' ? o.y+o.h*.5 : o.edgeY;
          for(let j=0;j<36;j++){
            const a=(Math.PI*2*j)/36 + Math.random()*.12;
            const v=120+Math.random()*190;
            heartBursts.push({
              x:ox,y:oy,
              vx:Math.cos(a)*v,vy:Math.sin(a)*v,
              life:.85,size:4+Math.random()*5
            });
          }
          // Extra bright shield flash centered on Becky.
          for(let j=0;j<16;j++){
            const a=(Math.PI*2*j)/16;
            heartBursts.push({
              x:bat.x*W,y:bat.y,
              vx:Math.cos(a)*150,vy:Math.sin(a)*150,
              life:.5,size:3+Math.random()*3
            });
          }
          obstacles.splice(i,1);
          continue;
        }
        return beginCrash();
      }
    }

    // Plane: deliberately moderate, consistent speed. It must fully cross, exit,
    // then re-enter from the left. It never collides and never affects gameplay.
    const planeSpeed = 100;
    plane.x += planeSpeed * dt;

    // The banner extends ~190 px to the LEFT of plane.x; the aircraft nose
    // extends ~35 px to the RIGHT. We deliberately wait until the trailing banner is fully clear, with extra margin, so
    // the whole composition visibly flies out rather than popping away.
    const planeSpawnX = -230;
    const planeResetX = W + 230;

    // One stable flag per complete fly-by. Flags advance independently through
    // all active destination flags instead of repeating the same city-linked set.
    if(!plane.flag) plane.flag=nextPlaneFlag();

    // Change the banner to a different country's flag during the same fly-by.
    // This is visual only and does not affect collisions, scoring or city progression.
    plane.flagSwitchTimer = Number.isFinite(plane.flagSwitchTimer) ? plane.flagSwitchTimer - dt : 2.2;
    if (plane.flagSwitchTimer <= 0) {
      plane.flag = nextPlaneFlag();
      plane.flagSwitchTimer = 1.8 + Math.random() * 1.6;
    }

    // This is the ONLY in-game plane reset.
    if (plane.x > planeResetX) {
      plane.x -= (planeResetX-planeSpawnX);
      plane.y = 58 + Math.random()*26;
      plane.flag = nextPlaneFlag();
      plane.flagSwitchTimer = 1.8 + Math.random()*1.6;
    }

    if (Math.random() < dt * 8) {
      wind.push({x:bat.x*W-18,y:bat.y+8,vx:-35,vy:(Math.random()-.5)*14,life:.6,len:16+Math.random()*24});
    }
    for (let i = wind.length - 1; i >= 0; i--) {
      const p = wind[i]; p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt;
      if (p.life <= 0) wind.splice(i,1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 70*dt;
      if (p.life <= 0) particles.splice(i,1);
    }
    for(let i=heartBursts.length-1;i>=0;i--){
      const p=heartBursts[i];
      p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;
      if(p.life<=0)heartBursts.splice(i,1);
    }
    scoreEl.innerHTML = Math.floor(distance) + '<small> m</small>';
    updateHeartHud('play');

  }

  function updateCrash(dt) {
    crashTime += dt;
    crashVelocity += 1150 * dt;
    bat.y += crashVelocity * dt;
    crashRotation += dt * 8;
    screenShake *= 0.92;
    impactFlash = Math.max(0, impactFlash - dt);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 420*dt;
      if (p.life <= 0) particles.splice(i,1);
    }
    if (crashTime > 1.35 || bat.y > H + 90) finishRun();
  }

  function gradient(top,bottom) {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,top); g.addColorStop(1,bottom);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }

  function drawAgra(){

    // Main onion dome: drum, bulbous profile, neck and lotus finial.
    ctx.fillStyle='#e7dfd3';ctx.fillRect(cx-mainW*.13,H*.395,mainW*.26,H*.065);
    ctx.fillStyle='#f7f1e8';
    ctx.beginPath();
    ctx.moveTo(cx-mainW*.145,H*.405);
    ctx.bezierCurveTo(cx-mainW*.155,H*.315,cx-mainW*.08,H*.265,cx,H*.245);
    ctx.bezierCurveTo(cx+mainW*.08,H*.265,cx+mainW*.155,H*.315,cx+mainW*.145,H*.405);
    ctx.closePath();ctx.fill();

    ctx.beginPath();ctx.arc(cx,H*.17,3,0,Math.PI*2);ctx.fill();

      ctx.fillStyle='#eee6da';ctx.fillRect(sx-mainW*.035,H*.405,mainW*.07,H*.06);
      ctx.fillStyle='#f6efe5';ctx.beginPath();ctx.arc(sx,H*.405,mainW*.045,Math.PI,0);ctx.fill();
      ctx.fillStyle='#9d815e';ctx.fillRect(sx-1,H*.36,2,H*.025);

    // Four free-standing minarets at the plinth corners, with balconies,

      ctx.fillStyle='#eee7dc';
      ctx.beginPath();ctx.moveTo(mx-mainW*.026,base);ctx.lineTo(mx-mainW*.019,top);ctx.lineTo(mx+mainW*.019,top);ctx.lineTo(mx+mainW*.026,base);ctx.closePath();ctx.fill();
      ctx.fillStyle='#cfc2b1';
      [H*.48,H*.59].forEach(y=>ctx.fillRect(mx-mainW*.032,y,mainW*.064,4));
      // minaret balcony/chhatri

      ctx.fillStyle='#f4ede2';ctx.beginPath();ctx.arc(mx,top,mainW*.035,Math.PI,0);ctx.fill();
      ctx.fillStyle='#96784f';ctx.fillRect(mx-1,top-H*.035,2,H*.035);
    });

    // Red sandstone mosque/guest-house silhouettes at the sides.
    ctx.fillStyle='#a65c45';
    ctx.fillRect(W*.05,H*.61,W*.14,H*.13);ctx.fillRect(W*.81,H*.61,W*.14,H*.13);
    for(const x of [W*.12,W*.88]){
      ctx.beginPath();ctx.arc(x,H*.61,W*.045,Math.PI,0);ctx.fill();
    }
    ctx.fillStyle='#5f4338';
    for(const x of [W*.09,W*.15,W*.85,W*.91]){
      ctx.beginPath();ctx.arc(x,H*.68,W*.015,Math.PI,0);ctx.fill();ctx.fillRect(x-W*.015,H*.68,W*.03,H*.055);
    }

    // Cypress-lined Mughal garden.
    for(let i=0;i<5;i++){
      for(const side of [-1,1]){
        const tx=cx+side*W*(.12+i*.065);
        ctx.fillStyle='#47754e';ctx.beginPath();ctx.moveTo(tx,H*.77);ctx.lineTo(tx-7,H*.69);ctx.lineTo(tx+7,H*.69);ctx.closePath();ctx.fill();

  function drawSanFrancisco(){
    gradient('#9ed6eb','#f4e6ce');
    const bay=H*.73;ctx.fillStyle='#4b99b2';ctx.fillRect(0,bay,W,H-bay);

    // Marin headlands and distant San Francisco skyline.
    ctx.fillStyle='#748b78';ctx.beginPath();ctx.moveTo(0,bay);ctx.quadraticCurveTo(W*.10,H*.55,W*.22,bay);ctx.fill();
    ctx.fillStyle='rgba(77,95,108,.58)';
    for(let i=0;i<7;i++){const x=W*(.60+i*.055),bh=H*(.08+((i*13)%12)/100);ctx.fillRect(x,bay-bh,W*.038,bh);}
    // Transamerica Pyramid.
    ctx.beginPath();ctx.moveTo(W*.78,H*.48);ctx.lineTo(W*.745,bay);ctx.lineTo(W*.815,bay);ctx.closePath();ctx.fill();

    // Golden Gate Bridge: two International Orange portal towers.
    const L=W*.245,R=W*.705,deck=H*.665,towerTop=H*.245;
    ctx.fillStyle='#c84f3b';
    for(const tx of [L,R]){
      // twin tower legs
      ctx.fillRect(tx-W*.035,towerTop,W*.020,deck-towerTop);
      ctx.fillRect(tx+W*.015,towerTop,W*.020,deck-towerTop);
      // three horizontal portal braces
      ctx.fillRect(tx-W*.043,towerTop+H*.035,W*.086,7);
      ctx.fillRect(tx-W*.043,towerTop+H*.125,W*.086,7);
      ctx.fillRect(tx-W*.043,towerTop+H*.215,W*.086,7);
      // slightly flared cap
      ctx.fillRect(tx-W*.040,towerTop-H*.012,W*.080,H*.020);
    }

    // Main suspension cable: anchor -> tower -> deep central parabola -> tower -> anchor.
    ctx.strokeStyle='#c84f3b';ctx.lineWidth=5;ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(W*.02,H*.50);
    ctx.quadraticCurveTo(W*.12,H*.39,L,towerTop);
    ctx.quadraticCurveTo(W*.475,H*.54,R,towerTop);
    ctx.quadraticCurveTo(W*.86,H*.39,W*.98,H*.50);
    ctx.stroke();

    // Secondary cable line gives the bridge its recognizable depth.
    ctx.strokeStyle='#df6850';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(W*.02,H*.52);
    ctx.quadraticCurveTo(W*.12,H*.41,L,towerTop+5);
    ctx.quadraticCurveTo(W*.475,H*.555,R,towerTop+5);
    ctx.quadraticCurveTo(W*.86,H*.41,W*.98,H*.52);
    ctx.stroke();

    // Straight vertical suspenders — no radial spokes.
    ctx.lineWidth=1.5;
    for(let i=1;i<23;i++){
      const u=i/23,px=W*.02+u*W*.96;
      let cy;
      if(px<L){
        const q=(px-W*.02)/(L-W*.02); cy=H*.50+(towerTop-H*.50)*q*q;
      }else if(px<R){
        const q=(px-L)/(R-L); cy=towerTop+(H*.54-towerTop)*4*q*(1-q);
      }else{
        const q=(px-R)/(W*.98-R); cy=towerTop+(H*.50-towerTop)*q*q;
      }
      ctx.beginPath();ctx.moveTo(px,cy);ctx.lineTo(px,deck);ctx.stroke();
    }

    // Road deck and underside truss.
    ctx.fillStyle='#384d56';ctx.fillRect(0,deck,W,8);
    ctx.strokeStyle='#6a4b40';ctx.lineWidth=1;
    for(let x=0;x<W;x+=18){ctx.beginPath();ctx.moveTo(x,deck+8);ctx.lineTo(x+18,deck+20);ctx.moveTo(x+18,deck+8);ctx.lineTo(x,deck+20);ctx.stroke();}
    ctx.fillStyle='#334650';ctx.fillRect(0,deck+19,W,4);

    // Fog ribbons around the bridge/headlands.
    ctx.fillStyle='rgba(247,249,247,.22)';ctx.fillRect(0,H*.39,W*.18,H*.06);ctx.fillRect(W*.78,H*.43,W*.22,H*.055);
  }

  function drawParis() {
    gradient('#b9e1ee','#f8efe0');
    const ground=H*.81;
    ctx.fillStyle='#b7d78a';ctx.fillRect(0,ground,W,H-ground);

    // Haussmann skyline: pale limestone facades and slate/red mansard roofs.
    for(let i=0;i<7;i++){
      const x=i*150-(worldScroll*.055%150),bw=128;
      ctx.fillStyle=['#d9c8b8','#cfbaaa','#e4d5c7'][i%3];ctx.fillRect(x,H*.61,bw,H*.20);
      ctx.fillStyle=['#7e6865','#9a5149','#6f6464'][i%3];
      ctx.beginPath();ctx.moveTo(x-5,H*.61);ctx.lineTo(x+18,H*.535);ctx.lineTo(x+bw-18,H*.535);ctx.lineTo(x+bw+5,H*.61);ctx.closePath();ctx.fill();
      ctx.fillStyle='#f0e2d1';
      for(let r=0;r<3;r++)for(let k=0;k<4;k++)ctx.fillRect(x+12+k*28,H*(.64+r*.052),12,16);
    }

    // Seine ribbon and stone embankment.
    ctx.fillStyle='#77afbd';ctx.fillRect(0,H*.765,W,H*.035);
    ctx.fillStyle='#b49b80';ctx.fillRect(0,H*.755,W,5);

    // Eiffel Tower: recognizable iron silhouette with arched base and lattice.
    const cx=W*.53,base=H*.79,top=H*.115,tw=Math.min(W*.245,205);
    ctx.strokeStyle='#6c5a4e';ctx.lineCap='round';

    // Four tapered legs / outer profile.
    ctx.lineWidth=8;
    ctx.beginPath();ctx.moveTo(cx,top);ctx.quadraticCurveTo(cx-tw*.10,H*.42,cx-tw*.50,base);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,top);ctx.quadraticCurveTo(cx+tw*.10,H*.42,cx+tw*.50,base);ctx.stroke();
    ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(cx,top+H*.08);ctx.quadraticCurveTo(cx-tw*.04,H*.45,cx-tw*.29,base);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,top+H*.08);ctx.quadraticCurveTo(cx+tw*.04,H*.45,cx+tw*.29,base);ctx.stroke();

    // Characteristic arch between the legs.
    ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(cx,base+H*.005,tw*.30,Math.PI,0);ctx.stroke();

    // Observation platforms.
    ctx.fillStyle='#655448';
    const levels=[
      [H*.615,tw*.38,8],
      [H*.405,tw*.20,7],
      [H*.255,tw*.10,5]
    ];
    levels.forEach(([y,half,h])=>ctx.fillRect(cx-half,y,half*2,h));

    // Dense iron cross-bracing inside the tower.
    ctx.strokeStyle='#7a6758';ctx.lineWidth=1.3;
    for(let i=0;i<10;i++){
      const y1=H*(.20+i*.052),y2=y1+H*.095;
      const f1=(y1-top)/(base-top),f2=(y2-top)/(base-top);
      const a1=tw*(.055+.42*f1),a2=tw*(.055+.42*f2);
      ctx.beginPath();ctx.moveTo(cx-a1,y1);ctx.lineTo(cx+a2,y2);ctx.moveTo(cx+a1,y1);ctx.lineTo(cx-a2,y2);ctx.stroke();
    }

    // Top cabin, antenna and beacon.
    ctx.fillStyle='#5e5046';ctx.fillRect(cx-6,H*.145,12,H*.045);
    ctx.fillRect(cx-2,top-H*.055,4,H*.075);
    ctx.fillStyle='#d6a64c';ctx.beginPath();ctx.arc(cx,top-H*.055,2.5,0,Math.PI*2);ctx.fill();

    // Arc de Triomphe and clipped tree rows.
    ctx.fillStyle='#c8ad8e';ctx.fillRect(W*.79,H*.63,W*.12,H*.14);
    ctx.fillStyle='#756252';ctx.beginPath();ctx.arc(W*.85,H*.69,17,Math.PI,0);ctx.fill();ctx.fillRect(W*.833,H*.69,W*.034,H*.08);
    for(let side=-1;side<=1;side+=2)for(let i=0;i<5;i++){
      const x=W*.53+side*W*(.16+i*.075);ctx.fillStyle='#669653';ctx.beginPath();ctx.arc(x,H*.75,15+i*1.5,0,Math.PI*2);ctx.fill();
    }
  }

  function drawAmsterdam(){

  function drawBrugesCity(){
    // Bruges: a golden Gothic dusk over the canal — the Belfry rising in
    // full medieval detail over crow-stepped gabled townhouses with
    // rippled painterly reflections, an arched stone bridge and gliding
    // swans, for the city's storybook charm.
    gradient('#a9cfe0','#f3d9a8');
    const glow=ctx.createRadialGradient(W*.5,H*.30,W*.02,W*.5,H*.30,W*.34);
    glow.addColorStop(0,'rgba(255,224,170,.55)');glow.addColorStop(1,'rgba(255,224,170,0)');
    ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);

    // cobbled quay and canal water.
    ctx.fillStyle='#8c8172';ctx.fillRect(0,H*.78,W,H*.06);
    for(let i=0;i<24;i++){ctx.fillStyle=i%2?'#7d7365':'#948a7a';ctx.fillRect(W*(i*.043),H*(.785+(i%3)*.006),W*.04,H*.012);}
    const water=ctx.createLinearGradient(0,H*.84,0,H);
    water.addColorStop(0,'#3f6f80');water.addColorStop(1,'#294f5e');
    ctx.fillStyle=water;ctx.fillRect(0,H*.84,W,H*.16);

    // crow-stepped gabled townhouses lining the canal — soft candy-pastel
    // pinks, creams and terracottas with cream stone trim on every step
    // and tiny green shutters, echoing the Markt square's storybook rows.
    const cols=['#e8a0a6','#f0dba3','#d97b56','#e8c17a','#dd8f8a','#c9a06a'];
    const steps=[4,3,5,4,3,4];
    for(let i=0;i<6;i++){
      const x=W*(.005+i*.168),base=H*.79,h=H*(.19+(i%3)*.035),w=W*.15,st=steps[i],col=cols[i%cols.length];
      ctx.fillStyle=col;ctx.fillRect(x,base-h,w,h);
      ctx.strokeStyle='#f5ecd8';ctx.lineWidth=2;
      for(let s=0;s<st;s++){const sw=w*(1-s/st),sh=H*.02,sx=x+(w-sw)/2,sy=base-h-sh*(s+1);ctx.fillStyle=col;ctx.fillRect(sx,sy,sw,sh);ctx.strokeRect(sx,sy,sw,sh);}
      ctx.fillStyle='#f7d98a';for(let r=0;r<3;r++)ctx.fillRect(x+w*.28,base-h+H*(.05+r*.062),w*.44,H*.036);
      ctx.fillStyle='#4d7a5a';for(let r=0;r<3;r++){ctx.fillRect(x+w*.19,base-h+H*(.05+r*.062),w*.07,H*.036);ctx.fillRect(x+w*.74,base-h+H*(.05+r*.062),w*.07,H*.036);}
      ctx.fillStyle='#3a2e24';ctx.fillRect(x+w*.72,base-h-H*.05,W*.012,H*.05);
      ctx.fillStyle='#5c8a52';ctx.fillRect(x+w*.24,base-h+H*.045,w*.16,H*.014);ctx.fillRect(x+w*.6,base-h+H*.045,w*.16,H*.014);
      if(i%2===0){ctx.fillStyle='#4a3527';ctx.beginPath();ctx.arc(x+w*.5,base-H*.05,W*.018,Math.PI,0);ctx.fill();ctx.fillRect(x+w*.5-W*.018,base-H*.05,W*.036,H*.05);}
    }

    // the Belfry of Bruges, rebuilt grander: a wide brick base with twin
    // arched windows, a narrower stone mid-tier with a proper clock face,
    // four corner pinnacle turrets, an octagonal crown and a tall
    // gilt-banded spire topped with a weathervane cross.
    const bx=W*.5;
    ctx.fillStyle='#b5654a';ctx.fillRect(bx-W*.105,H*.34,W*.21,H*.46);
    ctx.strokeStyle='rgba(70,45,30,.28)';ctx.lineWidth=1;
    for(let r=0;r<6;r++){ctx.beginPath();ctx.moveTo(bx-W*.105,H*(.36+r*.065));ctx.lineTo(bx+W*.105,H*(.36+r*.065));ctx.stroke();}
    ctx.fillStyle='#4a3226';
    for(let r=0;r<2;r++){const wy=H*(.47+r*.15);for(const dx of [-.045,.045]){ctx.beginPath();ctx.arc(bx+W*dx,wy,W*.013,Math.PI,0);ctx.fill();ctx.fillRect(bx+W*dx-W*.013,wy,W*.026,H*.06);}}
    ctx.fillStyle='#d8c49a';ctx.fillRect(bx-W*.085,H*.20,W*.17,H*.14);
    ctx.strokeStyle='#8a6a44';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(bx-W*.085,H*.20);ctx.lineTo(bx+W*.085,H*.20);ctx.moveTo(bx-W*.085,H*.34);ctx.lineTo(bx+W*.085,H*.34);ctx.stroke();
    ctx.fillStyle='#efe4c8';ctx.beginPath();ctx.arc(bx,H*.27,W*.034,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#4a3a2c';ctx.lineWidth=1.5;
    for(let k=0;k<12;k++){const a=(Math.PI*2/12)*k,r1=W*.034,r2=W*.027;ctx.beginPath();ctx.moveTo(bx+Math.cos(a)*r1,H*.27+Math.sin(a)*r1);ctx.lineTo(bx+Math.cos(a)*r2,H*.27+Math.sin(a)*r2);ctx.stroke();}
    ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,H*.27);ctx.lineTo(bx,H*.256);ctx.moveTo(bx,H*.27);ctx.lineTo(bx+W*.018,H*.27);ctx.stroke();
    ctx.fillStyle='#c9a06a';
    ctx.beginPath();ctx.moveTo(bx-W*.085,H*.20);ctx.lineTo(bx-W*.065,H*.155);ctx.lineTo(bx-W*.04,H*.13);ctx.lineTo(bx+W*.04,H*.13);ctx.lineTo(bx+W*.065,H*.155);ctx.lineTo(bx+W*.085,H*.20);ctx.closePath();ctx.fill();
    ctx.fillStyle='#8a6a44';
    for(const dx of [-.095,-.05,.05,.095]){ctx.beginPath();ctx.moveTo(bx+W*dx-3,H*.205);ctx.lineTo(bx+W*dx,H*.10);ctx.lineTo(bx+W*dx+3,H*.205);ctx.closePath();ctx.fill();ctx.fillStyle='#e8c96a';ctx.beginPath();ctx.arc(bx+W*dx,H*.097,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8a6a44';}
    ctx.fillStyle='#5c4a3a';ctx.beginPath();ctx.moveTo(bx-W*.038,H*.13);ctx.lineTo(bx,H*.025);ctx.lineTo(bx+W*.038,H*.13);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(230,210,170,.4)';ctx.lineWidth=1;
    for(let r=0;r<3;r++){const yy=H*(.045+r*.028),ww=W*.038*((H*.13-yy)/(H*.13-H*.025));ctx.beginPath();ctx.moveTo(bx-ww,yy);ctx.lineTo(bx+ww,yy);ctx.stroke();}
    ctx.strokeStyle='#e8c96a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(bx,H*.025);ctx.lineTo(bx,H*.005);ctx.moveTo(bx-W*.012,H*.012);ctx.lineTo(bx+W*.012,H*.012);ctx.stroke();
    ctx.fillStyle='#e8c96a';ctx.beginPath();ctx.arc(bx,H*.025,3,0,Math.PI*2);ctx.fill();

    // a pair of birds circling the tower.

    for(const [dx,dy] of [[-.16,.11],[.13,.08]]){ctx.beginPath();ctx.moveTo(bx+W*dx-6,H*dy);ctx.quadraticCurveTo(bx+W*dx,H*dy-5,bx+W*dx+6,H*dy);ctx.stroke();}

    // an arched stone bridge with visible voussoirs.
    ctx.strokeStyle='#a89478';ctx.lineWidth=9;ctx.beginPath();ctx.arc(W*.78,H*.84,W*.10,Math.PI,0);ctx.stroke();
    ctx.strokeStyle='#8a7860';ctx.lineWidth=1;
    for(let i=0;i<=8;i++){const a=Math.PI+(Math.PI/8)*i;ctx.beginPath();ctx.moveTo(W*.78+Math.cos(a)*W*.095,H*.84+Math.sin(a)*W*.095);ctx.lineTo(W*.78+Math.cos(a)*W*.105,H*.84+Math.sin(a)*W*.105);ctx.stroke();}

    // rippled painterly reflections of the gabled houses in the canal.
    ctx.save();ctx.globalAlpha=.28;
    for(let i=0;i<6;i++){const x=W*(.005+i*.168),h=H*(.19+(i%3)*.035)*.6,w=W*.15;ctx.fillStyle=cols[i%cols.length];ctx.fillRect(x,H*.84,w,h);}

  function drawLHC(){
    // The Hadron Collider, rebuilt to show the sheer complexity of the
    // real machine: a straight-on view down the detector's core, radiating
    // cryostat arms, girding steel trusses and a tiny engineer for scale —
    // keyed off a reference photo of the ATLAS/CMS cavern under construction.
    gradient('#1b2436','#0a0e18');
    ctx.fillStyle='#151c2b';ctx.fillRect(0,0,W,H);
    const cx=W*.5,cy=H*.40;

    // blue steel scaffolding trusses crisscrossing the cavern.
    ctx.strokeStyle='#3f6fa8';ctx.lineWidth=3;
    for(const [x1,y1,x2,y2] of [
      [0,H*.04,W*.40,cy],[W,H*.04,W*.60,cy],[0,H*.58,W*.40,cy],[W,H*.58,W*.60,cy],
      [0,H*.02,W,H*.09],[0,H*.63,W,H*.58]
    ]){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
    ctx.strokeStyle='#2c517e';ctx.lineWidth=5;
    for(const x of [W*.06,W*.16,W*.84,W*.94]){ctx.beginPath();ctx.moveTo(x,H*.02);ctx.lineTo(x,H*.90);ctx.stroke();}

    // four huge cryostat arms radiating diagonally toward the corners —
    // silvery cylinders banded with orange rings, echoing the real
    // detector's radiating toroid sections.
    function arm(angle,len){
      ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
      const w=H*.16;
      ctx.fillStyle='#9aa3ac';ctx.fillRect(W*.14,-w/2,len,w);
      ctx.fillStyle='#7d858e';ctx.fillRect(W*.14,-w/2,len,w*.22);
      ctx.fillStyle='#e0672f';
      for(let i=0;i<4;i++)ctx.fillRect(W*.14+len*(.08+i*.24),-w/2,len*.07,w);
      ctx.restore();
    }
    arm(-2.35,W*.62);arm(-.78,W*.62);arm(.78,W*.62);arm(2.35,W*.62);

    // the central detector endcap: concentric rings, alternating dark
    // steel, gold cabling and pale detector layers, face-on.
    const ringCols=['#0c0f15','#454c58','#c9a227','#5b6472','#8c94a0','#0c0f15','#c9a227'];
    for(let i=0;i<ringCols.length;i++){
      const f=(ringCols.length-i)/ringCols.length;
      ctx.fillStyle=ringCols[i];ctx.beginPath();ctx.arc(cx,cy,W*.22*f,0,Math.PI*2);ctx.fill();
    }
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;
    for(let i=0;i<20;i++){const a=i/20*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*W*.22,cy+Math.sin(a)*W*.22);ctx.stroke();}
    ctx.fillStyle='#05070b';ctx.beginPath();ctx.arc(cx,cy,W*.045,0,Math.PI*2);ctx.fill();

    // a green safety catwalk with a handrail at floor level.
    ctx.fillStyle='#2f3a2c';ctx.fillRect(0,H*.80,W,H*.06);
    ctx.strokeStyle='#7fae3f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,H*.79);ctx.lineTo(W,H*.79);ctx.stroke();

    // the orange floor platform, with a tiny engineer standing on it for
    // scale, exactly as in the reference photograph.
    ctx.fillStyle='#c9631f';ctx.fillRect(W*.30,H*.86,W*.40,H*.06);

  function drawPetroniusPlatform(){
    // The Petronius platform: one of the tallest free-standing structures
    // on Earth, a slender lattice tower reaching from the Gulf seabed to a
    // small topside deck — paired with a cutaway of the hydraulic
    // fracturing process that lets it draw oil and gas up from the shale.
    gradient('#7fc0dc','#dcefe0');
    ctx.fillStyle='#2c85a0';ctx.fillRect(0,H*.42,W,H*.28);
    // rock strata cutaway below the seabed.
    const strata=['#c9a373','#b98f5f','#a67c52','#8a6642','#6f5236'];
    for(let i=0;i<strata.length;i++){ctx.fillStyle=strata[i];ctx.fillRect(0,H*(.70+i*.06),W,H*.06);}

    const tx=W*.55;
    // the slender lattice tower rising from the seabed to the surface.
    ctx.strokeStyle='#8a94a0';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(tx-W*.05,H*.70);ctx.lineTo(tx-W*.012,H*.30);ctx.moveTo(tx+W*.05,H*.70);ctx.lineTo(tx+W*.012,H*.30);ctx.stroke();
    ctx.lineWidth=1.5;
    for(let i=0;i<8;i++){const y1=H*(.70-i*.05),y2=H*(.65-i*.05),hw=W*(.05-i*.0048);ctx.beginPath();ctx.moveTo(tx-hw,y1);ctx.lineTo(tx+hw,y2);ctx.moveTo(tx+hw,y1);ctx.lineTo(tx-hw,y2);ctx.stroke();}

    // the topside deck, derrick, flare boom and helipad above the water.
    ctx.fillStyle='#5a6470';ctx.fillRect(tx-W*.09,H*.28,W*.18,H*.025);
    ctx.strokeStyle='#c94f2f';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(tx-W*.02,H*.28);ctx.lineTo(tx-W*.03,H*.14);ctx.stroke();
    ctx.fillStyle='#e0672f';ctx.beginPath();ctx.arc(tx-W*.03,H*.135,4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#8a94a0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tx+W*.03,H*.28);ctx.lineTo(tx+W*.03,H*.16);ctx.moveTo(tx+W*.01,H*.28);ctx.lineTo(tx+W*.05,H*.19);ctx.stroke();
    ctx.fillStyle='#eee';ctx.beginPath();ctx.arc(tx-W*.14,H*.275,W*.03,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#c94f2f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(tx-W*.155,H*.275);ctx.lineTo(tx-W*.125,H*.275);ctx.moveTo(tx-W*.14,H*.26);ctx.lineTo(tx-W*.14,H*.29);ctx.stroke();

    // waterline crests near the surface only, so they don't wash out the
    // submerged tower below.
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,H*.44);ctx.quadraticCurveTo(W*.5,H*.42,W,H*.44);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,H*.475);ctx.quadraticCurveTo(W*.5,H*.455,W,H*.475);ctx.stroke();

    // the fracking wellbore: a wellhead at the seabed, drilling straight
    // down then turning horizontal through the shale layer.
    const wx=tx-W*.02,wellheadY=H*.70;
    ctx.fillStyle='#d9a13c';ctx.fillRect(wx-6,wellheadY-14,12,14);
    ctx.strokeStyle='#3a3f46';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(wx,wellheadY);ctx.lineTo(wx,H*.85);ctx.quadraticCurveTo(wx,H*.90,wx+W*.10,H*.90);ctx.lineTo(W*.92,H*.90);ctx.stroke();

    // fractures radiating from the horizontal well under high-pressure
    // fluid, with gas/oil bubbles escaping up into the pipe.
    ctx.strokeStyle='rgba(120,200,230,.85)';ctx.lineWidth=2;
    for(let i=0;i<5;i++){
      const fx=wx+W*.10+i*W*.065,fy=H*.90;
      for(const a of [-0.9,-0.3,0.3,0.9]){
        ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx+Math.cos(a)*W*.04,fy+Math.sin(a)*H*.03);ctx.stroke();
      }
    }
    ctx.fillStyle='rgba(230,240,120,.85)';
    for(let i=0;i<14;i++){
      const bx=wx+W*.10+(i%7)*W*.05;
      const by=H*.88-Math.floor(i/7)*H*.02-(i%3)*H*.008;
      ctx.beginPath();ctx.arc(bx,by,2.5,0,Math.PI*2);ctx.fill();
    }
  }

  function drawTwelveApostlesV70(){
    gradient('#e8935a','#f6c98a');ctx.fillStyle='#2c94ae';ctx.fillRect(0,H*.56,W,H*.44);
    // a warm horizon glow, kept soft rather than a hard disc.
    ctx.fillStyle='rgba(255,230,180,.30)';ctx.fillRect(0,H*.54,W,H*.08);
    // three giant, irregular rock stacks — bumpy, craggy and weathered,
    // built from overlapping rounded chunks rather than a smooth taper,
    // so they actually read as eroded rock rather than wooden posts.
    function rockStack(cx,halfW,h,seed){
      const baseY=H*.86,topY=baseY-h;
      // base silhouette: a jagged polygon with real bumps on both edges.
      const segs=9,left=[],right=[];
      for(let i=0;i<=segs;i++){
        const t=i/segs,y=baseY-h*t;
        const jag=(Math.sin(seed+i*2.1)*.6+Math.sin(seed*2.3+i*4.4)*.4)*halfW*.32;
        left.push([cx-halfW*(1-t*.22)+jag,y]);
      }
      for(let i=segs;i>=0;i--){
        const t=i/segs,y=baseY-h*t;
        const jag=(Math.cos(seed*1.4+i*2.4)*.6+Math.cos(seed*2.6+i*3.8)*.4)*halfW*.32;
        right.push([cx+halfW*(1-t*.22)+jag,y]);
      }
      ctx.fillStyle='#9c7850';
      ctx.beginPath();ctx.moveTo(left[0][0],left[0][1]);
      for(const [px,py] of left)ctx.lineTo(px,py);
      for(const [px,py] of right)ctx.lineTo(px,py);
      ctx.closePath();ctx.fill();
      // a soft shaded strip down the right-facing side for gentle volume.
      ctx.fillStyle='rgba(0,0,0,.15)';
      ctx.beginPath();ctx.moveTo(cx+halfW*.10,baseY);
      for(const [px,py] of right)ctx.lineTo(px,py);
      ctx.lineTo(cx+halfW*.10,topY);ctx.closePath();ctx.fill();
      // horizontal strata bands, the giveaway of sedimentary rock.
      ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=2;
      for(let r=1;r<=5;r++){const ry=baseY-h*r/6;ctx.beginPath();ctx.moveTo(cx-halfW*1.25,ry);ctx.lineTo(cx+halfW*1.25,ry);ctx.stroke();}
      // a tuft of hardy grass clinging to the flat top.
      ctx.fillStyle='#4d7a4a';ctx.beginPath();ctx.ellipse(cx,topY+3,halfW*.45,5,0,0,Math.PI*2);ctx.fill();
      // crashing whitewater and spray at the base.
      ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.ellipse(cx,baseY+H*.008,halfW*1.4,H*.022,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<5;i++){const spx=cx+(i-2)*halfW*.4,spy=baseY-H*(.015+Math.abs(i-2)*.012);ctx.beginPath();ctx.arc(spx,spy,4,0,Math.PI*2);ctx.fill();}
    }
    rockStack(W*.22,W*.13,H*.44,1.1);
    rockStack(W*.53,W*.16,H*.60,3.4);
    rockStack(W*.82,W*.11,H*.34,5.9);
    // seabirds circling above the stacks.
    ctx.strokeStyle='rgba(60,50,40,.7)';ctx.lineWidth=1.5;
    for(const [bxr,byr] of [[.35,.18],[.60,.13],[.70,.22]]){ctx.beginPath();ctx.moveTo(W*bxr-6,H*byr);ctx.quadraticCurveTo(W*bxr,H*byr-5,W*bxr+6,H*byr);ctx.stroke();}
    // cliff foreground
    ctx.fillStyle='#87684c';ctx.beginPath();ctx.moveTo(0,H*.72);ctx.lineTo(W*.16,H*.64);ctx.lineTo(W*.24,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#e8f1e8';ctx.lineWidth=3;for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(W*(.18+i*.10),H*.86);ctx.lineTo(W*(.24+i*.09),H*.91);ctx.stroke();}
  }

  function drawRomeDetailed(){
    // Rome, rebuilt a sixth time: a rooftop skyline view over the historic
    // centre at dusk, keyed off a reference photo of the Vittoriano
    // monument rising above a sea of Baroque domes and terracotta roofs —
    // not a single Colosseum facade or bowl. Ground-level and aerial
    // Colosseum studies kept reading as one flat building; a skyline of
    // many varied silhouettes against a warm hazy sky avoids that entirely.
    gradient('#e8c9a0','#bcd7e8');
    ctx.fillStyle='rgba(255,255,255,.5)';
    for(let i=0;i<10;i++){ctx.beginPath();ctx.arc(W*((i*53)%100)/100,H*.10+((i*17)%20),18,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='rgba(150,150,130,.35)';ctx.fillRect(0,H*.38,W,H*.06);

    // a dense band of small terracotta-roofed houses along the skyline.
    const roofCols=['#b9694a','#c9805a','#a85b3f','#cf8f66'];
    for(let i=0;i<14;i++){
      const x=W*(i*.075),h=H*(.10+((i*37)%5)*.025),y=H*.72-h;
      ctx.fillStyle=['#e8d5b0','#dcc79e','#e3cca5'][i%3];ctx.fillRect(x,y,W*.075,h);
      ctx.fillStyle=roofCols[i%4];ctx.beginPath();ctx.moveTo(x-W*.005,y);ctx.lineTo(x+W*.0375,y-H*.035);ctx.lineTo(x+W*.08,y);ctx.closePath();ctx.fill();
    }
    const fg=ctx.createLinearGradient(0,H*.72,0,H*.88);fg.addColorStop(0,'#8a7660');fg.addColorStop(1,'#4a4030');
    ctx.fillStyle=fg;ctx.fillRect(0,H*.72,W,H*.16);
    ctx.fillStyle='#4a4030';ctx.fillRect(0,H*.88,W,H*.12);
    ctx.strokeStyle='rgba(0,0,0,.14)';ctx.lineWidth=1;
    for(let i=1;i<12;i++){ctx.beginPath();ctx.moveTo(W*(i/12),H*.72);ctx.lineTo(W*(i/12),H);ctx.stroke();}

    // the Vittoriano: a white marble monument stepping up like a wedding
    // cake to a top colonnade, with bronze quadriga statues at each end.
    const vx=W*.20,vb=H*.50;
    ctx.fillStyle='#ddd7c8';ctx.fillRect(vx-W*.19,vb-H*.04,W*.38,H*.04);
    ctx.fillStyle='#e5dfd0';ctx.fillRect(vx-W*.16,vb-H*.09,W*.32,H*.05);
    ctx.fillStyle='#eee8da';ctx.fillRect(vx-W*.13,vb-H*.15,W*.26,H*.06);
    ctx.fillStyle='#f5f1e6';ctx.fillRect(vx-W*.15,vb-H*.19,W*.30,H*.045);
    ctx.strokeStyle='rgba(120,110,95,.55)';ctx.lineWidth=2;
    for(let i=0;i<9;i++){const cxp=vx-W*.13+i*W*.0325;ctx.beginPath();ctx.moveTo(cxp,vb-H*.185);ctx.lineTo(cxp,vb-H*.15);ctx.stroke();}
    ctx.fillStyle='#4a4a42';
    for(const dx of [-.145,.145]){
      ctx.beginPath();ctx.ellipse(vx+W*dx,vb-H*.205,W*.026,H*.016,0,0,Math.PI*2);ctx.fill();
      ctx.fillRect(vx+W*dx-W*.018,vb-H*.20,W*.036,H*.012);
    }

    // several ribbed Baroque church domes with small lantern cupolas.
    function dome(dx,dy,dr,col){
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(dx,dy,dr,Math.PI,0);ctx.fill();ctx.fillRect(dx-dr*.55,dy,dr*1.1,dr*.5);
      ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1.5;
      for(const off of [-.5,-.2,.2,.5]){ctx.beginPath();ctx.moveTo(dx,dy-dr);ctx.quadraticCurveTo(dx+dr*off,dy-dr*.5,dx+dr*off*1.4,dy);ctx.stroke();}
      ctx.fillStyle=col;ctx.fillRect(dx-dr*.06,dy-dr*1.28,dr*.12,dr*.3);ctx.beginPath();ctx.arc(dx,dy-dr*1.30,dr*.10,0,Math.PI*2);ctx.fill();
    }
    dome(W*.55,H*.58,W*.055,'#8f8f88');
    dome(W*.78,H*.50,W*.09,'#9a988c');
    dome(W*.90,H*.56,W*.045,'#8f8f88');

    // a bell/clock tower — a squat campanile, not a spire.
    const tx=W*.65,tb=H*.62,tTop=H*.42;
    ctx.fillStyle='#e3cca5';ctx.fillRect(tx-W*.028,tTop,W*.056,tb-tTop);
    ctx.fillStyle='#d3bd90';ctx.fillRect(tx-W*.036,tb-H*.05,W*.072,H*.05);
    ctx.fillStyle='#3f4a4a';ctx.beginPath();ctx.moveTo(tx-W*.036,tTop);ctx.lineTo(tx,tTop-H*.05);ctx.lineTo(tx+W*.036,tTop);ctx.closePath();ctx.fill();
    ctx.fillStyle='#efe6d0';ctx.beginPath();ctx.arc(tx,tTop+H*.045,W*.016,0,Math.PI*2);ctx.fill();

    // a tiny, hazy nod to the Colosseum in the far distance.
    ctx.fillStyle='rgba(150,130,100,.55)';
    ctx.beginPath();ctx.ellipse(W*.06,H*.62,W*.05,H*.05,0,Math.PI,0);ctx.lineTo(W*.11,H*.66);ctx.lineTo(W*.01,H*.66);ctx.closePath();ctx.fill();

    // a couple of cypress trees framing the scene.
    ctx.fillStyle='#2b4630';for(const x of [W*.36,W*.96]){ctx.beginPath();ctx.ellipse(x,H*.60,W*.018,H*.10,0,0,Math.PI*2);ctx.fill();}

  }
  const citySceneCache=new Map();
  const CITY_CACHE_LIMIT=4;
  function cacheCityScene(name,snap){
    if(citySceneCache.has(name)) citySceneCache.delete(name);
    citySceneCache.set(name,snap);
    while(citySceneCache.size>CITY_CACHE_LIMIT){
      const oldest=citySceneCache.keys().next().value;
      citySceneCache.delete(oldest);
    }
  }

  function drawLiveWeather(){
    // Weather is deliberately drawn every frame, never baked into a cached city.
    // This keeps rain/snow moving on iPhone while retaining cached landmark art.
    if(weatherBlend < 1){
      ctx.save();ctx.globalAlpha=1-weatherBlend;
      if(previousWeather==='rain')drawRain();
      if(previousWeather==='snow')drawSnow();
      ctx.restore();
    }
    ctx.save();ctx.globalAlpha=weatherBlend;
    if(weather==='rain')drawRain();
    if(weather==='snow')drawSnow();
    ctx.restore();
  }

  function buildCitySnapshot(c){
    // Render approved artwork with weather temporarily disabled so animated
    // precipitation is not frozen into the cached bitmap.
    const sw=weather,sp=previousWeather,st=weatherTarget,sb=weatherBlend;
    weather='sun';previousWeather='sun';weatherTarget='sun';weatherBlend=1;
    try{ renderCityArtwork(); }
    catch(err){
      console.error('City artwork recovered',c,err);
      ctx.clearRect(0,0,W,H);
      drawGenericCity(currentCity());
    }
    weather=sw;previousWeather=sp;weatherTarget=st;weatherBlend=sb;
    try{
      const snap=document.createElement('canvas');
      snap.width=canvas.width;snap.height=canvas.height;
      snap.getContext('2d').drawImage(canvas,0,0);
      cacheCityScene(c,snap);
      return snap;
    }catch(e){ return null; }
  }

  function drawBackground() {
    const c=currentCity().name;
    let cached=citySceneCache.get(c);
    if(!cached) cached=buildCitySnapshot(c);

    // Instant destination switch. Obstacles are separate gameplay objects,
    // so changing the city background never clears or recreates them.
    if(cached) ctx.drawImage(cached,0,0,W,H);
    else {
      ctx.clearRect(0,0,W,H);
      drawGenericCity(currentCity());
    }
  }

  function drawGenericCity(c){
    c = c || {name:'CITY',palette:['#8fc8e5','#f3e5cc'],landmarks:['oldtown','tower']};
    const palette = Array.isArray(c.palette) && c.palette.length>=2 ? c.palette : ['#8fc8e5','#f3e5cc'];
    gradient(palette[0],palette[1]);
    const ground=H*.81, lm=Array.isArray(c.landmarks)?c.landmarks:[];

    // Each destination gets its own street/terrain rhythm, derived from its name
    // so cities no longer share an identical generic skyline.
    const seed=[...c.name].reduce((a,ch)=>a+ch.charCodeAt(0),0);
    ctx.fillStyle=(['CAIRO','MARRAKESH','MUSCAT','DOHA','ABU DHABI','DUBAI'].includes(c.name))?'#c99561':
                  (['REYKJAVIK','AKUREYRI','TROMSO','ZERMATT','INTERLAKEN'].includes(c.name))?'#dfeef2':
                  '#70818a';
    ctx.fillRect(0,ground,W,H-ground);
    for(let i=0;i<8;i++){
      const x=i*135-(worldScroll*(.035+(seed%4)*.006)%135);
      const bh=H*(.075+(((seed+i*31)%20)/100));
      ctx.fillStyle=`rgba(${70+(seed+i*9)%45},${77+(seed+i*7)%40},${80+(seed+i*5)%35},.38)`;
      ctx.fillRect(x,ground-bh,100,bh);
    }

    function monument(type,x,base,w,h){
      ctx.save();

        ctx.beginPath();ctx.moveTo(x,base-h);ctx.lineTo(x-w*.09,base-h*.78);ctx.lineTo(x+w*.09,base-h*.78);ctx.closePath();ctx.fill();
        ctx.fillStyle='#d7b04c';ctx.beginPath();ctx.arc(x,base-h,3,0,Math.PI*2);ctx.fill();
      }
      // Domed religious / civic landmarks
      else if(['mosque','cathedral','basilica','church','duomo','dome','wat','grandpalace','palace','royalpalace','athenaeum','schonbrunn'].includes(type)){
        ctx.fillStyle='#d7b98f';ctx.fillRect(x-w*.34,base-h*.52,w*.68,h*.52);
        ctx.fillStyle='#8c735c';ctx.beginPath();ctx.arc(x,base-h*.52,w*.21,Math.PI,0);ctx.fill();
        ctx.fillStyle='#b99872';

        ctx.beginPath();ctx.moveTo(x+w*.287,base-h*.86);ctx.lineTo(x+w*.235,base-h*.73);ctx.lineTo(x+w*.34,base-h*.73);ctx.closePath();ctx.fill();

        ctx.fillStyle='#a4775c';ctx.fillRect(x-w*.43,base-h*.47,w*.18,h*.27);ctx.fillRect(x-w*.18,base-h*.55,w*.19,h*.35);ctx.fillRect(x+w*.08,base-h*.42,w*.22,h*.22);
        ctx.fillStyle='#f5f1e6';ctx.beginPath();ctx.moveTo(x+w*.25,base-h*.12);ctx.lineTo(x+w*.42,base-h*.12);ctx.lineTo(x+w*.32,base-h*.30);ctx.closePath();ctx.fill();

        ctx.fillStyle='#6d594b';for(let k=-3;k<=3;k++){ctx.beginPath();ctx.arc(x+k*w*.11,base-h*.19,w*.035,Math.PI,0);ctx.fill();ctx.fillRect(x+k*w*.11-w*.035,base-h*.19,w*.07,h*.16);}
      } else if(type==='parthenon'){
        ctx.fillStyle='#d1b98e';ctx.fillRect(x-w*.40,base-h*.12,w*.80,h*.12);for(let k=0;k<7;k++)ctx.fillRect(x-w*.34+k*w*.11,base-h*.52,w*.045,h*.40);
        ctx.beginPath();ctx.moveTo(x,base-h*.75);ctx.lineTo(x-w*.43,base-h*.52);ctx.lineTo(x+w*.43,base-h*.52);ctx.closePath();ctx.fill();
      } else if(type==='sagrada'){
        ctx.fillStyle='#aa8c70';for(let k=-2;k<=2;k++){const xx=x+k*w*.13,hh=h*(.58+(.2-Math.abs(k)*.035));ctx.fillRect(xx-w*.035,base-hh,w*.07,hh);ctx.beginPath();ctx.moveTo(xx,base-hh-h*.13);ctx.lineTo(xx-w*.055,base-hh);ctx.lineTo(xx+w*.055,base-hh);ctx.closePath();ctx.fill();}
      } else if(type==='petronas'){
        ctx.fillStyle='#a9c0c9';for(const d of [-1,1]){ctx.fillRect(x+d*w*.13-w*.055,base-h*.78,w*.11,h*.78);for(let k=0;k<5;k++)ctx.fillRect(x+d*w*.13-w*.075,base-h*(.20+k*.12),w*.15,4);}
        ctx.fillRect(x-w*.13,base-h*.48,w*.26,5);
      } else if(type==='atomium'){
        ctx.strokeStyle='#8297a0';ctx.lineWidth=5;const pts=[[0,-.65],[-.28,-.35],[.28,-.35],[-.34,.05],[.34,.05],[0,.28]];for(const [a,b] of [[0,1],[0,2],[1,3],[2,4],[3,5],[4,5],[1,2]]){ctx.beginPath();ctx.moveTo(x+pts[a][0]*w,base+pts[a][1]*h);ctx.lineTo(x+pts[b][0]*w,base+pts[b][1]*h);ctx.stroke();}ctx.fillStyle='#a7bbc3';for(const [px,py] of pts){ctx.beginPath();ctx.arc(x+px*w,base+py*h,w*.07,0,Math.PI*2);ctx.fill();}
      } else if(type==='merlion'){
        ctx.fillStyle='#e8e4d7';ctx.beginPath();ctx.arc(x,base-h*.55,w*.13,0,Math.PI*2);ctx.fill();ctx.fillRect(x-w*.08,base-h*.48,w*.16,h*.40);ctx.strokeStyle='#7bc0d0';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+w*.11,base-h*.55);ctx.quadraticCurveTo(x+w*.35,base-h*.48,x+w*.48,base-h*.18);ctx.stroke();
      } else if(type==='littlemermaid'){
        ctx.fillStyle='#607d74';ctx.beginPath();ctx.arc(x,base-h*.55,w*.07,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(x,base-h*.35,w*.09,h*.18,-.25,0,Math.PI*2);ctx.fill();ctx.fillStyle='#72685d';ctx.beginPath();ctx.ellipse(x,base-h*.06,w*.25,h*.08,0,0,Math.PI*2);ctx.fill();
      } else if(type==='pagoda'||type==='temple'){
        ctx.fillStyle='#8c5a49';for(let k=0;k<4;k++){const yy=base-h*(.15+k*.16),ww=w*(.40-k*.065);ctx.fillRect(x-ww*.32,yy,ww*.64,h*.12);ctx.beginPath();ctx.moveTo(x-ww*.50,yy);ctx.lineTo(x,yy-h*.08);ctx.lineTo(x+ww*.50,yy);ctx.closePath();ctx.fill();}
      } else if(type==='wall'){
        ctx.fillStyle='#a88c69';ctx.fillRect(x-w*.48,base-h*.18,w*.96,h*.18);for(let k=-2;k<=2;k++){ctx.fillRect(x+k*w*.20-w*.06,base-h*.34,w*.12,h*.34);}

      } else if(type==='cube'){
        ctx.fillStyle='#e5b54b';ctx.save();ctx.translate(x,base-h*.38);ctx.rotate(Math.PI/4);ctx.fillRect(-w*.15,-w*.15,w*.30,w*.30);ctx.restore();
      } else if(type==='gondola'){
        ctx.fillStyle='#292d31';ctx.beginPath();ctx.moveTo(x-w*.35,base-h*.12);ctx.quadraticCurveTo(x,base,x+w*.35,base-h*.12);ctx.lineTo(x+w*.25,base-h*.04);ctx.lineTo(x-w*.28,base-h*.04);ctx.closePath();ctx.fill();ctx.strokeStyle='#5c493b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+w*.15,base-h*.10);ctx.lineTo(x+w*.28,base-h*.50);ctx.stroke();
      } else if(type==='jesus'){

      } else if(type==='pyramid'){
        ctx.fillStyle='#c99558';ctx.beginPath();ctx.moveTo(x,base-h*.82);ctx.lineTo(x-w*.48,base);ctx.lineTo(x+w*.48,base);ctx.closePath();ctx.fill();
      } else if(type==='sphinx'){
        ctx.fillStyle='#b98955';ctx.beginPath();ctx.ellipse(x,base-h*.15,w*.32,h*.13,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x-w*.18,base-h*.32,w*.11,0,Math.PI*2);ctx.fill();
      } else if(type==='palaceculture'){

      } else if(type==='ferris'||type==='wheel'){
        ctx.strokeStyle='#8296a0';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,base-h*.42,w*.30,0,Math.PI*2);ctx.stroke();for(let k=0;k<8;k++){const a=k*Math.PI/4;ctx.beginPath();ctx.moveTo(x,base-h*.42);ctx.lineTo(x+Math.cos(a)*w*.30,base-h*.42+Math.sin(a)*w*.30);ctx.stroke();}
      } else if(type==='dragon'){
        ctx.strokeStyle='#49735e';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x-w*.30,base-h*.18);ctx.quadraticCurveTo(x,base-h*.55,x+w*.30,base-h*.22);ctx.stroke();ctx.fillStyle='#49735e';ctx.beginPath();ctx.moveTo(x+w*.30,base-h*.22);ctx.lineTo(x+w*.18,base-h*.34);ctx.lineTo(x+w*.40,base-h*.31);ctx.closePath();ctx.fill();
      } else if(type==='skyscraper'||type==='skyline'){

      } else if(type==='garden'||type==='park'){
        ctx.fillStyle='#6e9b67';for(let q=-2;q<=2;q++){ctx.beginPath();ctx.arc(x+q*w*.16,base-h*.20-(q%2)*h*.05,w*.12,0,Math.PI*2);ctx.fill();}

      } else if(type==='opera'||type==='museum'||type==='library'){
        ctx.fillStyle='#d0b998';ctx.fillRect(x-w*.38,base-h*.38,w*.76,h*.38);

    lm.slice(0,2).forEach((type,j)=>monument(type,W*(.28+j*.44),ground,Math.min(W*.25,170),H*.40));
    // Long-tail cities (after the first 300) use a deliberately abstract

    if(c.abstract){

    const detailSeed=[...c.name].reduce((a,ch)=>a+ch.charCodeAt(0),0);
    const detailLandmark=lm[0]||'oldtown';
    const accent=['#d8aa68','#9f6d61','#708d9a','#b6a06e','#7d927c','#8c79a0'][detailSeed%6];

      ctx.lineWidth=1.5;for(let q=0;q<7;q++){const px=sx-48+q*16;ctx.beginPath();ctx.moveTo(px,sy);ctx.lineTo(px,sy-24-Math.abs(q-3)*4);ctx.stroke();}
    }else if(['castle','fort','fortress','gate','brandenburg','redfort','alcazar'].includes(detailLandmark)){
      ctx.fillRect(sx-42,H*.50,84,H*.20);
      for(let q=-2;q<=2;q++){ctx.fillRect(sx+q*17-5,H*.39,10,H*.31);ctx.beginPath();ctx.moveTo(sx+q*17,H*.33);ctx.lineTo(sx+q*17-9,H*.39);ctx.lineTo(sx+q*17+9,H*.39);ctx.closePath();ctx.fill();}
    }else if(['mountain','alps','matterhorn','andes','volcano','vesuvius','hill','tablemountain'].includes(detailLandmark)){
      ctx.fillStyle='#68867b';ctx.beginPath();ctx.moveTo(sx,H*.34);ctx.lineTo(sx-82,H*.72);ctx.lineTo(sx+82,H*.72);ctx.closePath();ctx.fill();
      ctx.fillStyle='#edf3ef';ctx.beginPath();ctx.moveTo(sx,H*.34);ctx.lineTo(sx-20,H*.51);ctx.lineTo(sx,H*.47);ctx.lineTo(sx+20,H*.51);ctx.closePath();ctx.fill();
    }else if(['waterfront','harbor','bay','river','lake','fjord','canal','beach','coast','port'].includes(detailLandmark)){

  function drawClouds(){
    ctx.fillStyle='rgba(255,255,255,.62)';
    for(let i=0;i<5;i++){
      const x=(i*210-(worldScroll*.03%210));
      const y=52+(i%3)*40;
      ctx.beginPath();
      ctx.arc(x,y,17,0,Math.PI*2);
      ctx.arc(x+20,y-8,22,0,Math.PI*2);
      ctx.arc(x+43,y,16,0,Math.PI*2);
      ctx.fill();
    }
  }

  function drawRain(){
    // Wind-driven rain: droplets travel and lean in the same direction.
    ctx.strokeStyle='rgba(190,220,235,.40)';
    ctx.lineWidth=1.7;
    const fall=360, drift=-190;
    for(let i=0;i<85;i++){
      const x=((i*79 + t*drift + W*4)%W+W)%W;
      const y=(i*47 + t*fall)%H;
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x-10,y+19);
      ctx.stroke();
    }
  }
  function drawSnow(){
    // Live snow only: fall downward with a gentle leftward drift.
    // Positive modulo keeps flakes wrapping cleanly without jumping off-screen.
    ctx.fillStyle='rgba(255,255,255,.82)';
    for(let i=0;i<55;i++){
      const x=((i*93-worldScroll*.12)%W+W)%W;
      const y=(i*51+t*30)%H;
      ctx.beginPath();
      ctx.arc(x,y,1.5+(i%3),0,Math.PI*2);
      ctx.fill();
    }
  }

  function drawPlane(){
    // Seamless continuous fly-by. As the outgoing banner clears the right edge,
    // the next aircraft is already entering from the left, so the plane never pops away.
    drawPlaneAt(plane.x,plane.y,plane.flag);
    const wrapSpan=W+460;
    const ghostX=plane.x-wrapSpan;
    if(ghostX>-230) drawPlaneAt(ghostX,plane.y,plane.flag);
  }
